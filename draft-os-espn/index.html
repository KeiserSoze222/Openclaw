// State schema, defaults, migration, undo, persistence for the ESPN app.
// STORAGE ISOLATION: every localStorage key is prefixed "espn:" so this app
// and the Yahoo Superflex app can never read or overwrite each other's state,
// even when served from the same origin.
(function () {
  const NS = globalThis.DraftOS;
  const ST = NS.store = {};

  ST.VERSION = 2;
  ST.KEY = 'espn:draftos_state_v2';
  ST.AUTOSAVE_KEY = 'espn:draftos_autosave';
  ST.UNDO_LIMIT = 30;

  ST.defaultSettings = function () {
    return {
      teams: NS.clone(NS.DATA.TEAMS),
      mySlot: NS.DATA.MY_SLOT,
      myLabel: 'KeiserSoze',
      rounds: NS.DATA.ROUNDS,
      roundsMin: NS.DATA.ROUNDS_MIN,
      roundsMax: NS.DATA.ROUNDS_MAX,
      keepers: NS.clone(NS.DATA.KEEPERS),   // rounds BLANK = not kept
      byes: NS.clone(NS.DATA.BYES),
      clockSeconds: 90,
      tierSize: 12,
      eliteQBs: NS.clone(NS.DATA.ELITE_QBS),
      earlyTEs: NS.clone(NS.DATA.EARLY_TES),
      qb3Pick: 130,
      startable: { QB: 15, RB: 30, WR: 36, TE: 12 },  // rule 9: 1QB startable QB = top 15
      targets: { QB: 2, RB: 5, WR: 5, TE: 1, K: 1, DST: 1 },
      scarcityGap: 15,
      survivalFactors: { likely: 1.0, coinflip: 0.5 },
      panicProb: 80,
      // rule 9 sim appetite for a 12-team 1QB room (editable)
      simQB: { firstQBStart: 4, firstQBEnd: 9, secondQBAfter: 10 },
      overlay: NS.overlay.defaults(),
      flags: {
        monteCarlo: false,
        roadmap: false,
        buildGuard: false,
        byeLoad: false,
        markers: true,       // rule 6 needs the handcuff marker usable
        resilience: false    // draft grade only
      }
    };
  };

  ST.buildSampleQueue = function (settings) {
    const parsed = NS.parser.parseQueue(NS.DATA.SAMPLE_QUEUE_TEXT, {
      byes: settings.byes, keepers: [], tierSize: settings.tierSize
    });
    const fillers = NS.DATA.buildFillers().map(f => ({
      ...f, normName: NS.normName(f.name), marker: null, handcuffOf: null
    }));
    return parsed.players.concat(fillers);
  };

  // Rebuild the keeper pre-fills from the current settings, preserving live
  // picks. The core of the setup-guard "full clean recompute": also re-derives
  // each live pick's team/byMe from the (possibly changed) draft order and
  // drops picks beyond the (possibly shrunk) round count or now owned by a
  // keeper.
  ST.recompute = function (state) {
    const total = NS.board.totalPicks(state);
    const keeperEntries = NS.board.keeperPickEntries(state);
    const keeperPicks = new Set(keeperEntries.map(k => k.pick));
    const me = NS.board.myTeamName(state.settings);
    const live = state.picks
      .filter(p => !p.keeper && !keeperPicks.has(p.pick) && p.pick <= total)
      .map(p => {
        const team = NS.board.teamForPick(state, p.pick);
        return { ...p, team, byMe: team === me };
      });
    state.picks = keeperEntries.concat(live).sort((a, b) => a.pick - b.pick);
    if (NS.survival && NS.survival.clearCache) NS.survival.clearCache();
    return state;
  };

  ST.defaultState = function () {
    const settings = ST.defaultSettings();
    const state = {
      version: ST.VERSION,
      settings,
      myQueue: null,
      usingSample: true,
      adp: [],
      props: [],
      propsText: '',
      fp: [],
      fpText: '',
      injuries: NS.clone(NS.DATA.INJURY_TAGS),
      picks: [],
      log: [{ t: 'init', msg: 'Draft OS (ESPN) initialized. Set your slot + draft order, then keeper rounds.' }],
      ghost: false,
      undoStack: [],
      sim: null,
      grade: null
    };
    state.myQueue = ST.buildSampleQueue(settings);
    NS.overlay.applyPreTags(state);
    state.picks = NS.board.keeperPickEntries(state);
    return state;
  };

  // ---- Migration ------------------------------------------------------------
  ST.migrate = function (raw) {
    if (!raw || typeof raw !== 'object') throw new Error('not an object');
    const v = raw.version || 1;
    if (v > ST.VERSION) throw new Error(`state version ${v} is newer than app (${ST.VERSION})`);
    const base = ST.defaultState();
    const out = { ...base, ...raw };
    out.settings = { ...base.settings, ...(raw.settings || {}) };
    out.settings.flags = { ...base.settings.flags, ...((raw.settings || {}).flags || {}) };
    out.settings.startable = { ...base.settings.startable, ...((raw.settings || {}).startable || {}) };
    out.settings.targets = { ...base.settings.targets, ...((raw.settings || {}).targets || {}) };
    out.settings.overlay = { ...base.settings.overlay, ...((raw.settings || {}).overlay || {}) };
    out.settings.simQB = { ...base.settings.simQB, ...((raw.settings || {}).simQB || {}) };
    out.version = ST.VERSION;
    ST.validate(out);
    return NS.overlay.applyPreTags(out);
  };

  ST.validate = function (state) {
    if (!state || typeof state !== 'object') throw new Error('state is not an object');
    if (!Array.isArray(state.settings && state.settings.teams) || !state.settings.teams.length) {
      throw new Error('settings.teams missing');
    }
    if (!Array.isArray(state.myQueue)) throw new Error('myQueue missing');
    if (!Array.isArray(state.picks)) throw new Error('picks missing');
    return true;
  };

  // ---- Persistence (espn:-prefixed keys only) -------------------------------
  ST.save = function (state, storage) {
    const json = JSON.stringify(ST.exportable(state));
    try {
      const prev = storage.getItem(ST.KEY);
      if (prev) storage.setItem(ST.AUTOSAVE_KEY, prev);
      storage.setItem(ST.KEY, json);
    } catch (e) { /* quota - export button is the escape hatch */ }
    return json;
  };

  ST.load = function (storage) {
    const tryParse = key => {
      const raw = storage.getItem(key);
      if (!raw) return null;
      return ST.migrate(JSON.parse(raw));
    };
    try {
      const state = tryParse(ST.KEY);
      if (state) return { state };
      return { state: ST.defaultState(), fresh: true };
    } catch (e) {
      let autosave = null;
      try { autosave = tryParse(ST.AUTOSAVE_KEY); } catch (_) { /* both corrupt */ }
      return { corrupt: true, error: String(e), autosave, fresh: ST.defaultState() };
    }
  };

  ST.exportable = function (state) {
    const { undoStack, ...rest } = state;
    return rest;
  };

  ST.importJson = function (json) {
    const parsed = JSON.parse(json);
    const state = ST.migrate(parsed);
    state.undoStack = [];
    return state;
  };

  // ESPN pre-draft list: my queue as plain text, active keepers stripped,
  // K/DST at the bottom in order.
  ST.espnPreDraftList = function (state) {
    const kept = NS.board.activeKeeperKeys(state.settings);
    const q = state.myQueue.filter(p => !kept.has(p.normName));
    const skill = q.filter(p => !['K', 'DST'].includes(p.pos));
    const kdst = q.filter(p => ['K', 'DST'].includes(p.pos));
    return skill.concat(kdst).map(p => p.name).join('\n');
  };

  // ---- Undo -----------------------------------------------------------------
  const SNAP_FIELDS = ['picks', 'log', 'myQueue', 'ghost', 'usingSample', 'grade'];

  ST.snapshot = function (state) {
    const snap = {};
    SNAP_FIELDS.forEach(f => { snap[f] = NS.clone(state[f]); });
    state.undoStack.push(snap);
    if (state.undoStack.length > ST.UNDO_LIMIT) state.undoStack.shift();
  };

  ST.undo = function (state) {
    const snap = state.undoStack.pop();
    if (!snap) return false;
    SNAP_FIELDS.forEach(f => { state[f] = snap[f]; });
    return true;
  };

  if (typeof module !== 'undefined' && module.exports) module.exports = NS;
})();

/* ===== js/selftest.js ===== */
// Engine self-tests for the ESPN 12-team 1QB app. Deterministic fixtures.
// Shared by `npm test` (node --test wrapper) and the in-page Run self-test.
(function () {
  const NS = globalThis.DraftOS;
  const ST = NS.store;

  function makeT() {
    const results = [];
    let current = null;
    return {
      results,
      test(name, fn) {
        current = { name, pass: true, detail: '' };
        try { fn(); } catch (e) {
          current.pass = false;
          current.detail = String(e && e.message || e);
        }
        results.push(current);
      },
      ok(cond, msg) { if (!cond) throw new Error(msg || 'assertion failed'); },
      eq(a, b, msg) {
        if (JSON.stringify(a) !== JSON.stringify(b)) {
          throw new Error(`${msg || 'eq failed'}: ${JSON.stringify(a)} != ${JSON.stringify(b)}`);
        }
      }
    };
  }

  const fresh = () => ST.defaultState();

  function findQ(state, name) {
    const key = NS.normName(name);
    const p = state.myQueue.find(x => x.normName === key);
    if (!p) throw new Error(`fixture player not in queue: ${name}`);
    return p;
  }

  function addQ(state, rank, name, pos, team, tier) {
    const p = {
      rank, name, normName: NS.normName(name), pos, team,
      bye: state.settings.byes[team] ?? null, tier: tier || 6,
      tags: [], marker: null, handcuffOf: null
    };
    state.myQueue.push(p);
    return p;
  }

  function pushPick(state, pick, player, byMe) {
    const team = NS.board.teamForPick(state, pick);
    state.picks.push({
      pick, team, player: player.name, pos: player.pos,
      normName: player.normName, keeper: false, byMe: !!byMe
    });
  }

  function fill(state, through, opts) {
    opts = opts || {};
    const mine = opts.mine || {};
    const others = (opts.others || []).slice();
    const filled = new Set(state.picks.map(p => p.pick));
    let dummy = 0;
    for (let pick = 1; pick <= through; pick++) {
      if (filled.has(pick)) continue;
      if (NS.board.isMyPick(state, pick)) {
        const name = mine[pick];
        if (!name) throw new Error(`fixture: my pick ${pick} needs a player`);
        pushPick(state, pick, findQ(state, name), true);
      } else if (others.length) {
        pushPick(state, pick, findQ(state, others.shift()), false);
      } else {
        dummy++;
        pushPick(state, pick, { name: `Opp Dummy ${dummy}`, pos: 'WR', normName: `opp dummy ${dummy}` }, false);
      }
    }
  }

  function fakeStorage(seed) {
    const data = Object.assign({}, seed || {});
    return {
      getItem: k => (k in data ? data[k] : null),
      setItem: (k, v) => { data[k] = String(v); },
      removeItem: k => { delete data[k]; },
      _data: data
    };
  }

  NS.runSelfTests = function () {
    const t = makeT();
    // Default order: Joe(1) Rhett(2) Mike(3) Jeff(4=ME) TC(5) Max(6) Dan(7)
    // Pat(8) Jim(9) Ger(10) Team 11(11) Team 12(12). 16 rounds, no active keepers.
    const MY_LIVE_DEFAULT = [4, 21, 28, 45, 52, 69, 76, 93, 100, 117, 124, 141, 148, 165, 172, 189];

    t.test('pick order: slot 7, 12 teams, 16 rounds -> 192 picks + my numbers; rounds=14 recomputes', () => {
      const s = ST.defaultSettings();
      s.mySlot = 7;
      const order = NS.pickorder.buildOrder(s);
      t.eq(order.length, 192);
      t.eq(NS.pickorder.myPicks(s).live,
        [7, 18, 31, 42, 55, 66, 79, 90, 103, 114, 127, 138, 151, 162, 175, 186]);
      s.rounds = 14;
      t.eq(NS.pickorder.buildOrder(s).length, 168, '14 rounds -> 168 picks');
      t.eq(NS.pickorder.myPicks(s).live,
        [7, 18, 31, 42, 55, 66, 79, 90, 103, 114, 127, 138, 151, 162], 'my picks recompute');
    });

    t.test('default state: my picks at slot 4 (Jeff = KeiserSoze), no active keepers, blank rounds preloaded', () => {
      const st = fresh();
      t.eq(NS.pickorder.myPicks(st.settings).live, MY_LIVE_DEFAULT);
      t.eq(st.picks.length, 0, 'all keeper rounds are blank -> nothing pre-filled');
      t.eq(st.settings.keepers.length, 10, '10 keeper rows preloaded');
      t.ok(st.settings.keepers.every(k => k.round === null), 'all rounds blank');
      const shaheed = st.settings.keepers.find(k => k.team === 'Jeff');
      t.eq(shaheed.player, 'Rashid Shaheed', 'Jeff/Shaheed row exists, NOT kept');
      t.eq(NS.board.myTeamLabel(st.settings), 'KeiserSoze (Jeff)');
    });

    t.test('keeper add: Jim/Warren R8 -> pick 88 pre-filled + Warren off available; blanking restores both', () => {
      const st = fresh();
      addQ(st, 61, 'Tyler Warren', 'TE', 'IND');
      const row = st.settings.keepers.find(k => k.team === 'Jim');
      row.round = 8;
      ST.recompute(st);
      const { resolved } = NS.pickorder.resolveKeepers(st.settings);
      t.eq(resolved.length, 1);
      t.eq(resolved[0].pick, 88, 'Jim slot 9, R8 even -> pick 88');
      t.ok(st.picks.some(p => p.pick === 88 && p.keeper && p.player === 'Tyler Warren'), 'pre-filled');
      t.ok(!NS.board.available(st).some(p => p.normName === NS.normName('Tyler Warren')), 'off available');
      t.eq(st.picks[0].pos, 'TE', 'pos resolved from the queue');
      const tc = NS.board.teamCounts(st);
      t.eq(tc['Jim'].TE, 1, 'board counts include the keeper from pick 1');
      row.round = null;
      ST.recompute(st);
      t.ok(NS.board.available(st).some(p => p.normName === NS.normName('Tyler Warren')), 'back in available');
      t.ok(!st.picks.some(p => p.pick === 88), 'pick 88 back on the clock');
    });

    t.test('my-keeper (ME row): on my roster at pick 1, live picks drop by one, counts toward the build', () => {
      const st = fresh();
      addQ(st, 62, 'Rashid Shaheed', 'WR', 'NO');
      const row = st.settings.keepers.find(k => k.team === 'Jeff');
      // Blank round: none of the my-keeper behavior
      t.eq(NS.board.myRoster(st).length, 0, 'blank round -> not on roster');
      t.eq(NS.pickorder.myPicks(st.settings).live.length, 16);
      row.round = 4;
      ST.recompute(st);
      const roster = NS.board.myRoster(st);
      t.eq(roster.length, 1, 'on my roster');
      t.eq(roster[0].player, 'Rashid Shaheed');
      t.ok(roster[0].byMe && roster[0].keeper, 'flagged as my keeper');
      t.eq(roster[0].pick, 45, 'Jeff slot 4, R4 even -> pick 45');
      t.eq(NS.pickorder.myPicks(st.settings).live.length, 15, 'live picks drop by one');
      t.ok(!NS.pickorder.myPicks(st.settings).live.includes(45), 'round 4 pick consumed');
      t.eq(NS.board.posCounts(roster).WR, 1, 'counts toward the target build');
      const g = NS.buildpath.guard(st);
      t.eq(g.targets.WR - g.counts.WR, st.settings.targets.WR - 1, 'build guard sees the keeper WR');
      row.round = null;
      ST.recompute(st);
      t.eq(NS.board.myRoster(st).length, 0, 'blank again -> gone from roster');
      t.eq(NS.pickorder.myPicks(st.settings).live.length, 16);
    });

    t.test('two keepers on one team work; unmatched team name -> badge list, order not corrupted', () => {
      const st = fresh();
      st.settings.keepers.push({ team: 'Jim', player: 'Second Guy', round: 12 });
      st.settings.keepers.find(k => k.team === 'Jim' && k.player === 'Tyler Warren').round = 8;
      st.settings.keepers.push({ team: 'Nobody', player: 'Ghost Player', round: 3 });
      ST.recompute(st);
      const { resolved, unmatched } = NS.pickorder.resolveKeepers(st.settings);
      t.eq(resolved.length, 2, 'both Jim keepers resolved');
      t.eq(unmatched.length, 1, 'unmatched row reported');
      t.eq(unmatched[0].team, 'Nobody');
      const order = NS.pickorder.buildOrder(st.settings);
      t.eq(order.length, 192, 'order not corrupted');
      t.eq(order.filter(o => o.keeper).length, 2, 'unmatched keeper excluded from the board');
    });

    t.test('rule 5: rec card returns 5 legal names when 5 exist; fewer only when fewer are legal', () => {
      let st = fresh();
      fill(st, 3, {});
      let rec = NS.recommend(st);
      t.eq(rec.pick, 4);
      t.ok(rec.myPick, 'pick 4 is mine');
      t.eq(rec.espnQueue.length, 5, 'five names');
      t.eq(new Set(rec.espnQueue).size, 5, 'deduped');
      t.eq(rec.alts.length, 4, 'Alt2-Alt5');
      t.eq(rec.espnQueue[0], rec.primary.player.name, 'primary first');

      st = fresh();
      st.myQueue = st.myQueue.filter(p => ['Jahmyr Gibbs', 'Puka Nacua', 'Jonathan Taylor'].includes(p.name));
      fill(st, 3, {});
      rec = NS.recommend(st);
      t.eq(rec.espnQueue.length, 3, 'only 3 legal -> 3 names');
    });

    t.test('rule 1: rounds 1-4 never a QB (even Allen atop the queue); TE only McBride/Bowers', () => {
      const st = fresh();
      const allen = findQ(st, 'Josh Allen');
      st.myQueue = [{ ...allen, rank: 0 }].concat(st.myQueue.filter(p => p !== allen));
      for (const pick of [4, 21, 28, 45]) { // my picks in rounds 1-4
        const rec = NS.recommend(st, { forPick: pick });
        t.ok(rec.primary && rec.primary.player.pos !== 'QB', `primary not QB at pick ${pick}`);
        (rec.alts || []).forEach(a => t.ok(a.player.pos !== 'QB', `alts not QB at pick ${pick}`));
      }
      const rec4 = NS.recommend(st, { forPick: 4 });
      const dnt = rec4.doNotTake.find(d => d.player.normName === 'josh allen');
      t.ok(dnt && dnt.ruleId === 'R1', 'Allen blocked with R1 in round 1');
      // TE gate: McBride legal, a filler TE is not
      const ctx = NS.playbook.buildCtx(st, 4);
      t.ok(NS.playbook.legality(st, ctx, findQ(st, 'Trey McBride')).legal, 'McBride legal in rounds 1-4');
      const fillerTE = st.myQueue.find(p => p.pos === 'TE' && p.filler);
      t.eq(NS.playbook.legality(st, ctx, fillerTE).ruleId, 'R1', 'other TE blocked in rounds 1-4');
    });

    t.test('rule 2: exception at my 5th live pick only, both conditions required; QB legal from 6th', () => {
      // Case A: all tier-1/2 skill gone, Allen (tier 2) available -> fires at pick 52
      let st = fresh();
      const t12skill = st.myQueue.filter(p => p.tier <= 2 && NS.SKILL.includes(p.pos)).map(p => p.name);
      const mine = { 4: 'Jahmyr Gibbs', 21: "Ja'Marr Chase", 28: 'Puka Nacua', 45: 'Jonathan Taylor' };
      fill(st, 51, { mine, others: t12skill.filter(n => !Object.values(mine).includes(n)) });
      let rec = NS.recommend(st);
      t.eq(rec.pick, 52, '5th live pick');
      t.eq(rec.primary.player.name, 'Josh Allen', 'elite QB a full tier above skill -> taken');
      t.ok(rec.primary.why.rules.includes('R2'), 'R2 cited');

      // Case B: tier-1 skill still there -> tier condition fails, no QB at 52
      st = fresh();
      fill(st, 51, { mine });
      rec = NS.recommend(st);
      t.ok(rec.primary.player.pos !== 'QB', 'no QB when skill of equal/better tier remains');
      const dnt = rec.doNotTake.find(d => d.player.normName === 'josh allen');

/* ===== js/app.js ===== */
// UI layer. Everything below touches the DOM; all draft logic lives in the
// pure modules. In Node this file is a no-op so tests can require the bundle.
(function () {
  const NS = globalThis.DraftOS;
  if (typeof document === 'undefined') {
    if (typeof module !== 'undefined' && module.exports) module.exports = NS;
    return;
  }

  let S = null; // live state
  const ui = {
    tab: 'draft', posFilter: 'ALL', search: '',
    clock: { remaining: 90, running: false, timer: null },
    lastRec: null, roadmap: null,
    rapidOpen: false, rapidTarget: '', rapidRefocus: false
  };

  const $ = sel => document.querySelector(sel);
  const esc = s => String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');

  function toast(msg) {
    const t = $('#toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(toast._t);
    toast._t = setTimeout(() => t.classList.remove('show'), 2200);
  }

  function save() { NS.store.save(S, localStorage); }

  // Wrap every mutating action: snapshot for undo, run, persist, redraw.
  function act(fn) {
    NS.store.snapshot(S);
    fn();
    save();
    render();
  }

  // ---- boot -----------------------------------------------------------------
  function boot() {
    const loaded = NS.store.load(localStorage);
    if (loaded.corrupt) {
      const useAuto = loaded.autosave &&
        confirm('Stored state is corrupt.\n\nOK = restore from last autosave\nCancel = start fresh');
      S = useAuto ? loaded.autosave : loaded.fresh;
      if (!useAuto && loaded.autosave === null) alert('No autosave found - starting fresh.');
    } else {
      S = loaded.state;
    }
    S.undoStack = S.undoStack || [];
    ui.clock.remaining = S.settings.clockSeconds;
    bindHeader();
    render();
    save();
    // PWA: only over http(s) - file:// stays plain and fully working.
    if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
      navigator.serviceWorker.register('./sw.js').catch(() => { /* optional */ });
    }
  }

  // ---- header + clock -------------------------------------------------------
  function bindHeader() {
    $('#clockStart').onclick = () => { ui.clock.running = true; ensureTimer(); };
    $('#clockPause').onclick = () => { ui.clock.running = false; };
    $('#clockReset').onclick = () => { ui.clock.remaining = S.settings.clockSeconds; ui.clock.running = false; renderClock(); };
    $('#ghostBtn').onclick = toggleGhost;
    $('#undoBtn').onclick = () => {
      if (NS.store.undo(S)) { save(); render(); toast('Undone'); }
      else toast('Nothing to undo');
    };
  }

  function ensureTimer() {
    if (ui.clock.timer) return;
    ui.clock.timer = setInterval(() => {
      if (ui.clock.running && ui.clock.remaining > 0) {
        ui.clock.remaining--;
        renderClock();
      }
    }, 1000);
  }

  function renderClock() {
    const c = $('#clock');
    const m = Math.floor(ui.clock.remaining / 60), s = ui.clock.remaining % 60;
    c.textContent = `${m}:${String(s).padStart(2, '0')}`;
    c.classList.toggle('low', ui.clock.remaining <= 15);
  }

  function toggleGhost() {
    act(() => {
      S.ghost = !S.ghost;
      S.log.push({ t: 'ghost', msg: S.ghost ? 'GHOST MODE ON - recs frozen. Use the paper / ESPN queue.' : 'Ghost mode off - recs resumed' });
    });
  }

  // SETUP GUARD: structural edits (slot, order, rounds, keepers) after any
  // marked pick require a confirm, then a full clean recompute. Before any
  // pick is marked they apply instantly.
  function applySetupChange(mutFn) {
    const hasLive = S.picks.some(p => !p.keeper);
    if (hasLive && !confirm('Picks have already been marked. Changing the setup will recompute the board, clock, and counts. Continue?')) {
      render();
      return false;
    }
    act(() => {
      mutFn();
      NS.store.recompute(S);
      ui.clock.remaining = S.settings.clockSeconds;
      ui.clock.running = false;
    });
    return true;
  }

  function renderHeader() {
    const cur = NS.board.currentPick(S);
    const info = $('#pickInfo');
    if (cur === null) { info.innerHTML = '<b>Draft complete</b>'; return; }
    const { round } = NS.pickorder.slotForPick(cur, S.settings.teams.length);
    const team = NS.board.teamForPick(S, cur);
    const mine = NS.board.isMyPick(S, cur);
    const next = NS.pickorder.myNextLivePick(S.settings, mine ? cur + 1 : cur);
    const between = next ? NS.pickorder.livePicksBetween(S.settings, mine ? cur : cur - 1, next) : 0;
    info.innerHTML =
      `Pick ${cur} &middot; R${round} &middot; ${mine ? '<span style="color:var(--good)">YOU</span>' : esc(team)}` +
      `<span class="sub">${mine ? 'YOU ARE ON THE CLOCK' : `my next: ${next ?? '-'} (${between} picks away)`}</span>`;
    $('#ghostBtn').classList.toggle('on', !!S.ghost);
    renderClock();
  }

  // ---- shared bits ----------------------------------------------------------
  function playerPills(p) {
    let h = '';
    if (p.tier) h += `<span class="pill">T${p.tier}</span>`;
    if (p.bye != null) h += `<span class="pill">bye ${p.bye}</span>`;
    (p.tags || []).forEach(tag => {
      if (tag !== 'filler') h += `<span class="badge">${esc(tag)}</span>`;
    });
    if (p.marker === 'target') h += '<span class="pill star">&#9733; target</span>';
    if (p.marker === 'avoid') h += '<span class="pill fade">avoid</span>';
    if (p.handcuffOf) h += `<span class="pill">cuff: ${esc(p.handcuffOf)}</span>`;
    if (p.injury) h += `<span class="pill inj">${esc(p.injury)}</span>`;
    // Upside overlay tags (always on)
    const cur = NS.board.currentPick(S) || 1;
    NS.overlay.tagsFor(S, cur, p).forEach(tag => {
      const cls = tag.kind === 'fade' ? 'fade' : tag.kind === 'stack' ? 'stack' : tag.kind === 'dual' ? 'rule' : 'star';
      h += `<span class="pill ${cls}">${esc(tag.label)}</span>`;
    });
    (p.props || []).forEach(pr => {
      if (pr.tag) h += `<span class="pill ${pr.tag === 'money edge' ? 'money' : 'fade'}">${esc(pr.tag)}</span>`;
    });
    return h;
  }

  function survPill(row) {
    const cls = row.label === 'likely' ? 'surv-likely' : row.label === 'coin-flip' ? 'surv-coin' : 'surv-gone';
    const pct = row.prob !== null && row.prob !== undefined ? ` ${row.prob}%` : '';
    return `<span class="pill ${cls}" title="${esc(NS.survival.formulaText(S))}">${row.label}${pct}</span>`;
  }

  function decorateLite(p) {
    const inj = (S.injuries || []).find(i => NS.normName(i.name) === p.normName);
    return { ...p, injury: inj ? inj.tag : null, props: (S.props || []).filter(pr => pr.normName === p.normName), allenStack: p.team === 'BUF' && ['WR', 'TE', 'RB'].includes(p.pos) };
  }

  // ---- pick actions ---------------------------------------------------------
  function markPick(player, byMe, teamOverride) {
    // Always confirm my own pick - a wrong tap here is the worst failure.
    if (byMe && !confirm(`Confirm YOUR pick: ${player.name} (${player.pos})?`)) return;
    act(() => {
      const pick = NS.board.currentPick(S);
      if (pick === null) return;
      const team = byMe ? NS.board.myTeamName(S.settings) : (teamOverride || NS.board.teamForPick(S, pick));
      S.picks.push({ pick, team, player: player.name, pos: player.pos, normName: player.normName, keeper: false, byMe });
      const rec = ui.lastRec;
      const matched = !!(byMe && rec && rec.primary && rec.primary.player.normName === player.normName);
      S.log.push({
        t: byMe ? 'mypick' : 'pick', pick, team, player: player.name, pos: player.pos,
        matchedPrimary: byMe ? matched : undefined,
        rules: byMe && rec && rec.primary ? rec.primary.why.rules : []
      });
      if (byMe) {
        const plan = NS.nextPlan(S);
        S.log.push({ t: 'plan', msg: plan });
        S.lastPlan = plan;
      }
      ui.clock.remaining = S.settings.clockSeconds;
      ui.clock.running = false;
    });
  }

  function longPressify(elem, player) {
    let timer = null;
    const start = () => { timer = setTimeout(() => { timer = null; showConflict(player); }, 550); };
    const cancel = () => { if (timer) { clearTimeout(timer); timer = null; } };
    elem.addEventListener('touchstart', start, { passive: true });
    elem.addEventListener('mousedown', start);
    ['touchend', 'touchmove', 'mouseup', 'mouseleave'].forEach(ev => elem.addEventListener(ev, cancel));
  }

  function showConflict(player) {
    const res = NS.conflictCheck(S, player);
    alert(res.legal
      ? `${player.name}: ${res.note}`
      : `${player.name} conflicts with the playbook.\n\n${res.note}`);
  }

  // ---- render root ----------------------------------------------------------
  const TABS = [
    ['draft', 'Draft'], ['keepers', 'Keepers'], ['playbook', 'Playbook'], ['queue', 'Queue'],
    ['board', 'Board'], ['props', 'Props'], ['fp', 'FP'], ['log', 'Log'],
    ['settings', 'Settings'], ['sim', 'Simulate']
  ];

  function render() {
    renderHeader();
    const bar = $('#tabbar');
    bar.innerHTML = TABS.map(([id, label]) =>
      `<button data-tab="${id}" class="${ui.tab === id ? 'on' : ''}">${label}</button>`).join('');
    bar.querySelectorAll('button').forEach(b => {
      b.onclick = () => { ui.tab = b.dataset.tab; render(); };
    });
    const main = $('#main');
    main.innerHTML = '';
    const renderers = {
      draft: renderDraftTab, keepers: renderKeepersTab, playbook: renderPlaybookTab,
      queue: renderQueueTab, board: renderBoardTab, props: renderPropsTab, fp: renderFpTab,
      log: renderLogTab, settings: renderSettingsTab, sim: renderSimTab
    };
    renderers[ui.tab](main);
    // Precompute the next-pick rec (and warm the MC cache) during other
    // teams' picks so the card is instant when my clock starts.
    setTimeout(() => { try { NS.safeRecommend(S); } catch (e) { /* contained */ } }, 30);
  }

  // ---- DRAFT tab ------------------------------------------------------------
  function renderDraftTab(main) {
    const rec = NS.safeRecommend(S);
    ui.lastRec = rec && !rec.engineError ? rec : ui.lastRec;

    // Alerts
    let alerts = '';
    if (rec.engineError) {
      alerts += `<div class="banner red">engine error - see console / Log tab. Raw list + clock still live.</div>`;
      console.error(rec.engineError);
      if (!S.log.some(l => l.t === 'error' && l.msg === rec.engineError)) {
        S.log.push({ t: 'error', msg: rec.engineError });
      }
    }
    if (S.ghost) alerts += `<div class="banner purple">Recs frozen. Use the paper / ESPN queue.</div>`;
    if (!rec.engineError) {
      (rec.notes || []).forEach(n => { alerts += `<div class="banner amber">${esc(n)}</div>`; });
    }
    const unmatchedK = NS.board.unmatchedKeepers(S.settings);
    if (unmatchedK.length) {
      alerts += `<div class="banner red">Keeper rows with unmatched team names (excluded from the board): ${unmatchedK.map(k => esc(`${k.team} / ${k.player}`)).join(', ')} - fix them in the Keepers tab.</div>`;
    }
    if (S.settings.flags.buildGuard) {
      const g = NS.buildpath.guard(S);
      if (g.message) alerts += `<div class="banner red">${esc(g.message)}</div>`;
      alerts += `<div class="banner amber">${esc(g.remainingText)}</div>`;
    }
    if (S.settings.flags.byeLoad) byeLoadAlerts().forEach(a => { alerts += `<div class="banner ${a.red ? 'red' : 'amber'}">${esc(a.msg)}</div>`; });
    main.insertAdjacentHTML('beforeend', alerts);

    renderRapidCatchup(main);
    renderRecCard(main, rec);
    renderRoster(main);
    renderAvailable(main);
  }

  // Rapid catch-up: type 3+ letters, tap the match, it goes to the next
  // on-the-clock team (keeper picks are pre-filled, so they're skipped).
  function renderRapidCatchup(main) {
    const sec = document.createElement('section');
    sec.className = 'card';
    sec.id = 'rapidCard';
    const cur = NS.board.currentPick(S);
    const target = parseInt(ui.rapidTarget, 10);
    let behind = '';
    if (cur !== null && !isNaN(target)) {
      const n = Math.max(0, target - cur);
      behind = n > 0
        ? `<div class="banner amber" style="margin:6px 0">You are ${n} pick${n > 1 ? 's' : ''} behind.</div>`
        : `<div class="banner" style="margin:6px 0;background:#0f3a1f;border:1px solid var(--good)">Caught up.</div>`;
    }
    const nextTeam = cur !== null ? NS.board.teamForPick(S, cur) : '-';
    sec.innerHTML = `<details ${ui.rapidOpen ? 'open' : ''} id="rapidDetails"><summary>Rapid catch-up</summary>
      <div class="fieldRow"><label>Live draft is at pick #</label>
        <input type="number" id="rapidTarget" value="${esc(ui.rapidTarget)}" min="1" max="190"></div>
      ${behind}
      <div class="dim">Next assignment: pick ${cur ?? '-'} &rarr; ${esc(nextTeam)}${cur !== null && NS.board.isMyPick(S, cur) ? ' (YOU)' : ''}</div>
      <input type="search" id="rapidInput" placeholder="Type 3+ letters, tap the match"
        style="width:100%;font-size:20px;min-height:56px;margin-top:6px" autocomplete="off">
      <div id="rapidMatches"></div>
    </details>`;
    main.appendChild(sec);

    const det = sec.querySelector('#rapidDetails');
    det.addEventListener('toggle', () => { ui.rapidOpen = det.open; });
    sec.querySelector('#rapidTarget').onchange = e => { ui.rapidTarget = e.target.value; render(); };
    const input = sec.querySelector('#rapidInput');
    const matches = sec.querySelector('#rapidMatches');
    input.oninput = () => {
      matches.innerHTML = '';
      const q = input.value.trim();
      if (q.length < 3) return;
      const avail = NS.board.available(S);
      const key = NS.normName(q);
      let hits = avail.filter(p => p.normName.includes(key));
      if (!hits.length) {
        const m = NS.matchName(q, avail);
        hits = m.kind === 'exact' ? [m.player] : (m.suggestions || []);
      }
      hits.slice(0, 6).forEach(p => {
        const b = document.createElement('button');
        b.style.cssText = 'display:block;width:100%;text-align:left;margin-top:6px';
        b.textContent = `${p.name}  (${p.pos}${p.team ? ' ' + p.team : ''})`;
        b.onclick = () => {
          const pick = NS.board.currentPick(S);
          if (pick === null) return;
          ui.rapidRefocus = true;
          markPick(p, NS.board.isMyPick(S, pick));
        };
        matches.appendChild(b);
      });
    };
    if (ui.rapidRefocus && ui.rapidOpen) {
      ui.rapidRefocus = false;
      setTimeout(() => { const el = document.querySelector('#rapidInput'); if (el) el.focus(); }, 0);
    }
  }

  function renderRecCard(main, rec) {
    const sec = document.createElement('section');
    sec.className = 'card';
    sec.id = 'recCard';
    if (S.ghost) sec.classList.add('frozen');
    if (rec.engineError || rec.draftOver) {
      sec.innerHTML = rec.draftOver ? '<h2>Draft complete</h2>' : '<h2>Recommendation unavailable</h2>';
      main.appendChild(sec);
      return;
    }
    const rulePills = ids => ids.map(id => `<span class="pill rule">${id}</span>`).join('');

    if (!rec.myPick) {
      sec.innerHTML = `<h2>Next up: pick ${rec.nextMyPick ?? '-'} in ${rec.picksUntilMine} picks</h2>` +
        (S.lastPlan ? `<div class="dim">Plan: ${esc(S.lastPlan)}</div>` : '') +
        `<div class="dim">Watch list (your top legal targets):</div>` +
        (rec.watch || []).map(w =>
          `<div class="recRow"><div class="pInfo"><span class="recName">${esc(w.player.name)}</span>
           <span class="pill">${w.player.pos}</span>${playerPills(w.player)} ${survPill(w)}</div></div>`).join('') +
        panelsHtml(rec);
      main.appendChild(sec);
      return;
    }

    const slotRow = (label, item) => item ? `
      <div class="recRow"><div class="recLabel">${label}</div>
        <div class="pInfo">
          <div><span class="recName">${esc(item.player.name)}</span>
            <span class="pill">${item.player.pos}</span><span class="pill">#${item.player.rank}</span>
            ${playerPills(item.player)} ${rulePills(item.why.rules)}</div>
          <div class="recWhy">${esc(item.why.text)}</div>
        </div></div>` : '';

    // R5: five names - Primary + Alt2-Alt5
    sec.innerHTML = `<h2>Pick ${rec.pick} - YOUR PICK</h2>` +
      slotRow('Primary', rec.primary) +
      (rec.alts || []).map((a, i) => slotRow(`Alt${i + 2}`, a)).join('') +
      ((rec.espnQueue || []).length ? `<div style="margin-top:6px"><b>ESPN queue should be:</b> ${rec.espnQueue.map(esc).join(' &middot; ')}</div>` : '') +
      (rec.reachOrWait ? `<div class="dim" style="margin-top:6px">${esc(rec.reachOrWait)}</div>` : '') +
      (S.lastPlan ? `<div class="dim" style="margin-top:6px">Plan: ${esc(S.lastPlan)}</div>` : '') +
      (rec.doNotTake.length ? `<details><summary>Do not take (${rec.doNotTake.length})</summary>` +
        rec.doNotTake.map(d => `<div class="dim">${esc(d.player.name)} - <span class="pill rule">${d.ruleId}</span> ${esc(d.reason)}</div>`).join('') + '</details>' : '') +
      panelsHtml(rec);
    main.appendChild(sec);
    if (rec.primary) {
      const takeBtn = document.createElement('button');
      takeBtn.className = 'primaryBtn';
      takeBtn.textContent = `I picked ${rec.primary.player.name}`;
      takeBtn.style.marginTop = '8px';
      takeBtn.onclick = () => markPick(rec.primary.player, true);
      sec.appendChild(takeBtn);
    }
  }

  function panelsHtml(rec) {
    const st = rec.startable;
    let h = `<div class="countChips" style="margin-top:10px">` +
      ['QB', 'RB', 'WR', 'TE'].map(p => `<span class="pill">startable ${p}: ${st[p]}</span>`).join('') + '</div>';
    h += `<div class="countChips">` + rec.scarcity.map(sc =>
      `<span class="pill" style="${sc.cliff ? 'border-color:var(--bad);color:var(--bad)' : ''}">${sc.pos} cliff: ${sc.gap === null ? `only ${sc.thin} left` : sc.gap}</span>`).join('') + '</div>';
    if (rec.survival && rec.survival.length) {
      h += `<details><summary>Survival to pick ${rec.nextMyPick ?? '-'}</summary>` +
        rec.survival.map(sv => `<div>${esc(sv.player.name)} ${survPill(sv)}</div>`).join('') +
        `<div class="dim">${esc(NS.survival.formulaText(S))}${rec.monteCarlo ? ` Monte Carlo: ${rec.monteCarlo.n} sims${rec.monteCarlo.capped ? ' (capped for speed)' : ''}.` : ''}</div></details>`;
    }
    if (rec.costOfWaiting && rec.costOfWaiting.length) {
      h += `<details><summary>Cost of waiting</summary>` +
        rec.costOfWaiting.map(c => `<div class="dim">${esc(c.text)}</div>`).join('') + '</details>';
    }
    return h;
  }

  function byeLoadAlerts() {
    const out = [];
    const roster = NS.board.myRoster(S).map(p => {
      const q = S.myQueue.find(x => x.normName === p.normName);
      return { ...p, bye: q ? q.bye : null };
    }).filter(p => p.bye != null);
    const byBye = {};
    roster.forEach(p => { (byBye[p.bye] = byBye[p.bye] || []).push(p); });
    for (const [bye, players] of Object.entries(byBye)) {
      if (players.length >= 3) out.push({ red: false, msg: `Bye ${bye}: ${players.length} players (${players.map(p => p.player).join(', ')})` });
      const byPos = {};
      players.forEach(p => { (byPos[p.pos] = byPos[p.pos] || []).push(p); });
      for (const [pos, list] of Object.entries(byPos)) {
        if (list.length >= 2) out.push({ red: true, msg: `Bye ${bye}: ${list.length} ${pos}s share it (${list.map(p => p.player).join(', ')})` });
      }
    }
    return out;
  }

  function renderRoster(main) {
    const roster = NS.board.myRoster(S);
    const counts = NS.board.posCounts(roster);
    const targets = S.settings.targets;
    // ESPN lineup: QB, WR, WR, RB, RB, TE, FLEX (W/R/T), K, DST + bench.
    // The 2 IR slots are extra and never counted.
    const SLOTS = ['QB', 'WR', 'WR', 'RB', 'RB', 'TE', 'FLEX', 'K', 'DST'];
    const pool = roster.slice();
    const takeWhere = pred => { const i = pool.findIndex(pred); return i >= 0 ? pool.splice(i, 1)[0] : null; };
    const assigned = SLOTS.map(slot => {
      let p = null;
      if (['QB', 'RB', 'WR', 'TE', 'K', 'DST'].includes(slot)) p = takeWhere(x => x.pos === slot);
      else if (slot === 'FLEX') p = takeWhere(x => ['WR', 'RB', 'TE'].includes(x.pos));
      return { slot, p };
    });
    const byeOf = p => {
      const q = S.myQueue.find(x => x.normName === p.normName);
      return q && q.bye != null ? q.bye : null;
    };
    const byeCounts = {};
    roster.forEach(p => { const b = byeOf(p); if (b != null) byeCounts[b] = (byeCounts[b] || 0) + 1; });

    const sec = document.createElement('section');
    sec.className = 'card';
    sec.innerHTML = `<h2>My Roster - ${esc(NS.board.myTeamLabel(S.settings))} (${roster.length}/${S.settings.rounds})</h2>` +
      `<div id="rosterGrid">` + assigned.map(a =>
        `<div class="slot">${a.slot}</div><div>${a.p ? `${esc(a.p.player)} <span class="dim">${a.p.pos}${byeOf(a.p) != null ? ' - bye ' + byeOf(a.p) : ''}${a.p.keeper ? ' - keeper' : ''}</span>` : '<span class="dim">-</span>'}</div>`).join('') +
      pool.map(p => `<div class="slot">BN</div><div>${esc(p.player)} <span class="dim">${p.pos}${byeOf(p) != null ? ' - bye ' + byeOf(p) : ''}</span></div>`).join('') +
      `</div><div class="countChips">` +
      ['QB', 'RB', 'WR', 'TE', 'K', 'DST'].map(pos =>
        `<span class="pill" style="${counts[pos] >= targets[pos] ? 'border-color:var(--good)' : ''}">${pos} ${counts[pos]}/${targets[pos]}</span>`).join('') +
      `</div><div class="byeGrid">` +
      Object.keys(byeCounts).sort((a, b) => a - b).map(b =>
        `<span class="byeCell">wk ${b}: ${byeCounts[b]}</span>`).join('') +
      `</div>`;
    main.appendChild(sec);
  }

  function renderAvailable(main) {
    const sec = document.createElement('section');
    sec.className = 'card';
    const avail = NS.board.available(S);
    const cur = NS.board.currentPick(S);
    const filtered = avail.filter(p => {
      if (ui.posFilter !== 'ALL' && p.pos !== ui.posFilter) return false;
      if (ui.search) {
        const m = NS.matchName(ui.search, [p]);
        if (m.kind !== 'exact' && !p.normName.includes(NS.normName(ui.search))) return false;
      }
      return true;
    }).slice(0, 40);

    sec.innerHTML = `<h2>Available (${avail.length})</h2>
      <input id="searchBox" type="search" placeholder="Search players... (type GHOST MODE to freeze)" value="${esc(ui.search)}" style="width:100%">
      <div id="posChips"></div>
      <div class="fieldRow"><label>"Someone else" assigns to:</label><select id="teamSel"></select></div>
      <div id="availList"></div>
      <details><summary>Catch-up paste (last N picks in order)</summary>
        <textarea id="catchupBox" placeholder="Player A, Player B, Player C&#10;(or one per line)"></textarea>
        <button id="catchupApply">Apply catch-up</button>
        <div id="catchupResult" class="dim"></div>
      </details>`;
    main.appendChild(sec);

    const sb = sec.querySelector('#searchBox');
    sb.oninput = () => {
      if (sb.value.trim().toUpperCase() === 'GHOST MODE') { sb.value = ''; ui.search = ''; toggleGhost(); return; }
      ui.search = sb.value;
      renderAvailListOnly(sec, cur);
    };
    const chips = sec.querySelector('#posChips');
    ['ALL', 'QB', 'RB', 'WR', 'TE', 'K', 'DST'].forEach(pos => {
      const b = document.createElement('button');
      b.textContent = pos;
      if (ui.posFilter === pos) b.classList.add('on');
      b.onclick = () => { ui.posFilter = pos; render(); };
      chips.appendChild(b);
    });
    const teamSel = sec.querySelector('#teamSel');
    const onClock = cur !== null ? NS.board.teamForPick(S, cur) : null;
    S.settings.teams.forEach(t => {
      const o = document.createElement('option');
      o.value = t.name; o.textContent = t.name + (t.name === onClock ? ' (on the clock)' : '');
      if (t.name === onClock) o.selected = true;
      teamSel.appendChild(o);
    });
    renderAvailListOnly(sec, cur);

    sec.querySelector('#catchupApply').onclick = () => {
      const names = NS.parser.parseCatchup(sec.querySelector('#catchupBox').value);
      if (!names.length) return;
      const res = NS.board.assignCatchup(S, names);
      act(() => {
        res.assignments.forEach(a => {
          S.picks.push(a);
          S.log.push({ t: a.byMe ? 'mypick' : 'pick', pick: a.pick, team: a.team, player: a.player, pos: a.pos, catchup: true, rules: [] });
        });
      });
      const un = res.unmatched.map(u => `${u.name}${u.suggestions.length ? ` (did you mean: ${u.suggestions.join(' / ')}?)` : ''}`);
      toast(`Assigned ${res.assignments.length} picks${un.length ? `, ${un.length} unmatched` : ''}`);
      if (un.length) alert('Unmatched (fix and re-paste just these):\n' + un.join('\n'));
    };
  }

  function renderAvailListOnly(sec, cur) {
    const nextMine = cur !== null ? NS.pickorder.myNextLivePick(S.settings, NS.board.isMyPick(S, cur) ? cur + 1 : cur) : null;
    const between = nextMine && cur !== null ? NS.pickorder.livePicksBetween(S.settings, NS.board.isMyPick(S, cur) ? cur : cur - 1, nextMine) : 0;
    const avail = NS.board.available(S).filter(p => {
      if (ui.posFilter !== 'ALL' && p.pos !== ui.posFilter) return false;
      if (ui.search && !p.normName.includes(NS.normName(ui.search))) {
        const m = NS.matchName(ui.search, [p]);
        if (m.kind !== 'exact') return false;
      }
      return true;
    }).slice(0, 40);
    const list = sec.querySelector('#availList');
    list.innerHTML = '';
    const teamSel = sec.querySelector('#teamSel');
    avail.forEach(p => {
      const d = decorateLite(p);
      const row = document.createElement('div');
      row.className = 'playerRow';
      const surv = cur !== null ? NS.survival.heuristic(S, p, cur, between) : 'likely';
      row.innerHTML = `<div class="pInfo"><div class="pName">#${p.rank} ${esc(p.name)}</div>
        <div class="pMeta">${p.pos}${p.team ? ' - ' + esc(p.team) : ''}${playerPills(d)} ${survPill({ label: surv, prob: null })}</div></div>`;
      const meBtn = document.createElement('button');
      meBtn.className = 'small primaryBtn';
      meBtn.textContent = 'I picked';
      meBtn.onclick = () => markPick(p, true);
      const otherBtn = document.createElement('button');
      otherBtn.className = 'small';
      otherBtn.textContent = 'Other';
      otherBtn.onclick = () => markPick(p, false, teamSel.value);
      row.appendChild(meBtn);
      row.appendChild(otherBtn);
      longPressify(row.querySelector('.pName'), p);
      list.appendChild(row);
    });
  }

  // ---- KEEPERS tab ----------------------------------------------------------
  // Rows of {team name, player name, round}. Blank round = not kept (player
  // stays in the queue). Resolved to pick numbers against the saved draft
  // order; an unmatched team name gets a red badge and is excluded from the
  // board until fixed - never silently dropped.
  function renderKeepersTab(main) {
    const s = S.settings;
    const sec = document.createElement('section');
    sec.className = 'card';
    const me = NS.board.myTeamName(s);
    const { resolved } = NS.pickorder.resolveKeepers(s);
    const resolvedFor = k => resolved.find(r =>
      r.team === k.team && NS.normName(r.player) === NS.normName(k.player) && r.round === parseInt(k.round, 10));

    sec.innerHTML = `<h2>Keepers</h2>
      <div class="dim">Blank round = not kept (player stays in the queue). Filling a round strips the player,
      pre-fills that team's pick, and skips it on the clock. A row for <b>${esc(me)}</b> (ME) with a round set
      also lands on your roster and consumes that round's pick. Rounds 1-${s.rounds}.</div>
      <datalist id="teamNames">${s.teams.map(t => `<option value="${esc(t.name)}">`).join('')}</datalist>
      <div id="keeperRows"></div>
      <button id="keeperAdd">+ Add keeper row</button>`;
    main.appendChild(sec);

    const rows = sec.querySelector('#keeperRows');
    s.keepers.forEach((k, i) => {
      const row = document.createElement('div');
      row.className = 'fieldRow';
      const res = resolvedFor(k);
      const roundSet = !!parseInt(k.round, 10);
      const unmatched = roundSet && !res && !s.teams.some(t => t.name === k.team);
      row.innerHTML = `
        <input type="text" list="teamNames" data-kf="team" value="${esc(k.team)}" style="width:90px" placeholder="team">
        <input type="text" data-kf="player" value="${esc(k.player)}" style="width:150px" placeholder="player">
        <input type="number" data-kf="round" value="${k.round || ''}" min="1" max="${s.rounds}" style="width:64px" placeholder="rd">
        <span>${k.team === me ? '<span class="pill" style="border-color:var(--good);color:var(--good)">ME</span>' : ''}
        ${res ? `<span class="pill">pick ${res.pick}</span>` : ''}
        ${unmatched ? '<span class="pill" style="background:#67060c;border-color:var(--bad)">unmatched team</span>' : ''}
        ${!roundSet ? '<span class="pill">not kept</span>' : ''}</span>`;
      row.querySelectorAll('[data-kf]').forEach(inp => {
        inp.onchange = () => {
          applySetupChange(() => {
            const field = inp.dataset.kf;
            if (field === 'round') k.round = inp.value === '' ? null : parseInt(inp.value, 10);
            else k[field] = inp.value.trim();
          });
        };
      });
      const del = document.createElement('button');
      del.className = 'small dangerBtn';
      del.innerHTML = '&#10005;';
      del.onclick = () => {
        if (!confirm(`Remove keeper row ${k.team} / ${k.player}?`)) return;
        applySetupChange(() => { s.keepers.splice(i, 1); });
      };
      row.appendChild(del);
      rows.appendChild(row);
    });

      applySetupChange(() => { s.keepers.push({ team: '', player: '', round: null }); });

      <details ${S.usingSample ? 'open' : ''}><summary>Paste rankings (replaces the whole queue)</summary>

      // active keepers are filtered out of "available" dynamically instead.
      const parsed = NS.parser.parseQueue(text, { byes: S.settings.byes, keepers: [], tierSize: S.settings.tierSize });
      if (!parsed.players.length) return toast('No players parsed');
      const kept = NS.board.activeKeeperKeys(S.settings);
      const keptNames = parsed.players.filter(p => kept.has(p.normName)).map(p => p.name);
      if (!confirm(`Replace the ENTIRE queue with ${parsed.players.length} players?` +
        (keptNames.length ? `\n(Currently kept, will stay hidden from available: ${keptNames.join(', ')})` : '') +
        (parsed.warnings.length ? `\n${parsed.warnings.length} unparsed lines will be dropped.` : ''))) return;
      act(() => {
        S.myQueue = parsed.players;
        S.usingSample = false;
        NS.overlay.applyPreTags(S); // rule-7 pre-tags survive every paste
        NS.store.recompute(S);      // keeper entries re-resolve pos/bye from the new queue
        S.log.push({ t: 'queue', msg: `Queue replaced: ${parsed.players.length} players` });
      });

      const pos = (prompt('Position (QB/RB/WR/TE/K/DST):') || '').toUpperCase();
      const team = (prompt('NFL team abbrev (blank = unknown):') || '').toUpperCase();
      act(() => {
        S.myQueue.push({
          rank: S.myQueue.length + 1, name, normName: NS.normName(name), pos, team,
          bye: S.settings.byes[team] ?? null, tier: S.myQueue.length ? S.myQueue[S.myQueue.length - 1].tier : 1,
          tags: pos && team ? [] : ['needs data'], marker: null, handcuffOf: null
        });
        renumber();
      });
    };
    renderQueueList(sec.querySelector('#qList'));
  }

  function renumber() {
    S.myQueue.forEach((p, i) => { p.rank = i + 1; });
  }

  function renderQueueList(host) {
    host.innerHTML = '';
    const gone = NS.board.pickedKeys(S);
    let lastTier = null;
    S.myQueue.forEach((p, i) => {
      if (p.tier !== lastTier) {
        lastTier = p.tier;
        const th = document.createElement('div');
        th.className = 'qRow tierHead';
        th.textContent = `TIER ${p.tier}`;
        host.appendChild(th);
      }
      const row = document.createElement('div');
      row.className = 'qRow';
      const drafted = gone.has(p.normName);
      row.innerHTML = `<div class="qName" style="${drafted ? 'text-decoration:line-through;color:var(--dim)' : ''}">
        #${p.rank} ${esc(p.name)} <span class="dim">${p.pos}${p.team ? ' ' + esc(p.team) : ''}${p.bye != null ? ' b' + p.bye : ''}</span>${playerPills(decorateLite(p))}</div>`;
      const mk = (label, fn, cls) => {
        const b = document.createElement('button');
        b.className = 'small' + (cls ? ' ' + cls : '');
        b.innerHTML = label;
        b.onclick = fn;
        return b;
      };
      row.appendChild(mk('&#9650;', () => act(() => { if (i > 0) { S.myQueue.splice(i - 1, 0, S.myQueue.splice(i, 1)[0]); S.myQueue[i - 1].tier = S.myQueue[i].tier; renumber(); } })));
      row.appendChild(mk('&#9660;', () => act(() => { if (i < S.myQueue.length - 1) { S.myQueue.splice(i + 1, 0, S.myQueue.splice(i, 1)[0]); S.myQueue[i + 1].tier = S.myQueue[i].tier; renumber(); } })));
      row.appendChild(mk('&#9998;', () => {
        const name = prompt('Name:', p.name); if (name === null) return;
        const pos = prompt('Pos:', p.pos); if (pos === null) return;
        const team = prompt('Team:', p.team); if (team === null) return;
        act(() => {
          p.name = name; p.normName = NS.normName(name);
          p.pos = pos.toUpperCase(); p.team = team.toUpperCase();
          p.bye = S.settings.byes[p.team] ?? p.bye;
          p.tags = (p.pos && p.team && p.bye != null) ? p.tags.filter(t => t !== 'needs data') : p.tags;
        });
      }));
      if (S.settings.flags.markers) {
        const label = p.marker === 'target' ? '&#9733;' : p.marker === 'avoid' ? '&#10060;' : p.handcuffOf ? '&#128279;' : '&#9734;';
        row.appendChild(mk(label, () => {
          act(() => {
            if (!p.marker && !p.handcuffOf) p.marker = 'target';
            else if (p.marker === 'target') { p.marker = 'avoid'; }
            else if (p.marker === 'avoid') {
              p.marker = null;
              const of = prompt('Handcuff of (blank = none):', '');
              p.handcuffOf = of || null;
            } else { p.handcuffOf = null; p.marker = null; }
          });
        }));
      }
      // Overlay pre-tags are removable here (they are stored by name in
      // settings, so removal survives future pastes too).
      NS.overlay.tagsFor(S, NS.board.currentPick(S) || 1, p).forEach(tag => {
        if (!tag.list) return; // stack is computed, not stored
        row.appendChild(mk(`${esc(tag.label)} &#10005;`, () => act(() => {
          const list = S.settings.overlay[tag.list] || [];
          const idx = list.findIndex(n => NS.normName(n) === p.normName);
          if (idx >= 0) list.splice(idx, 1);
          if (tag.list === 'targets' && S.settings.overlay.targetFrom) {
            for (const n of Object.keys(S.settings.overlay.targetFrom)) {
              if (NS.normName(n) === p.normName) delete S.settings.overlay.targetFrom[n];
            }
          }
        })));
      });
      if (NS.overlay.handcuffStarter(S, p.normName)) {
        row.appendChild(mk('cuff &#10005;', () => act(() => {
          for (const n of Object.keys(S.settings.overlay.handcuffs || {})) {
            if (NS.normName(n) === p.normName) delete S.settings.overlay.handcuffs[n];
          }
          p.handcuffOf = null;
        })));
      }
      row.appendChild(mk('&#8213;', () => act(() => { // insert tier break after this player
        for (let j = i + 1; j < S.myQueue.length; j++) S.myQueue[j].tier++;
      })));
      row.appendChild(mk('&#10005;', () => { if (confirm(`Delete ${p.name} from queue?`)) act(() => { S.myQueue.splice(i, 1); renumber(); }); }, 'dangerBtn'));
      longPressify(row.querySelector('.qName'), p);
      host.appendChild(row);
    });
  }

  // ---- LOG tab --------------------------------------------------------------
  function buildRecap() {
    const lines = ['=== DRAFT RECAP ==='];
    const picks = S.picks.slice().sort((a, b) => a.pick - b.pick);
    let round = 0;
    picks.forEach(p => {
      const r = NS.pickorder.slotForPick(p.pick, S.settings.teams.length).round;
      if (r !== round) { round = r; lines.push(`\n-- Round ${r} --`); }
      lines.push(`${p.pick}. ${p.team}: ${p.player} (${p.pos})${p.keeper ? ' [keeper]' : ''}${p.byMe ? ' <== ME' : ''}`);
    });
    lines.push('\n=== MY ROSTER ===');
    NS.board.myRoster(S).forEach(p => lines.push(`${p.pick}. ${p.player} (${p.pos})`));
    const counts = NS.board.posCounts(NS.board.myRoster(S));
    lines.push(`Counts: QB ${counts.QB} / RB ${counts.RB} / WR ${counts.WR} / TE ${counts.TE} / K ${counts.K} / DST ${counts.DST}`);
    lines.push('\n=== RULES FIRED PER PICK ===');
    S.log.filter(l => l.t === 'mypick').forEach(l =>
      lines.push(`Pick ${l.pick}: ${l.player} ${l.rules && l.rules.length ? '[' + l.rules.join(', ') + ']' : '[queue order]'}${l.matchedPrimary === false ? ' (off-script)' : ''}`));
    if (S.settings.flags.resilience) {
      const mine = S.log.filter(l => l.t === 'mypick' && l.matchedPrimary !== undefined);
      if (mine.length) {
        const hit = mine.filter(l => l.matchedPrimary).length;
        lines.push(`\n=== DRAFT GRADE ===`);
        lines.push(`Followed primary rec: ${hit}/${mine.length} (${Math.round(100 * hit / mine.length)}%)`);
        if ((S.adp || []).length) {
          let value = 0, n = 0;
          S.log.filter(l => l.t === 'mypick').forEach(l => {
            const a = S.adp.find(x => x.normName === NS.normName(l.player));
            if (a) { value += l.pick - a.rank; n++; }
          });
          if (n) lines.push(`Value vs ADP: ${value >= 0 ? '+' : ''}${value} total picks over ${n} matched picks`);
        }
      }
    }
    return lines.join('\n');
  }

  function renderLogTab(main) {
    const sec = document.createElement('section');
    sec.className = 'card';
    sec.innerHTML = `<h2>Log / Export</h2>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <button id="exportBtn" class="primaryBtn">Export State (JSON)</button>
        <button id="recapBtn">Text recap</button>

      <button id="importBtn" class="dangerBtn">Import State (replaces everything)</button>
      <h3>Draft log</h3><div id="logList">` +
      S.log.slice().reverse().slice(0, 200).map(l => {
        if (l.t === 'plan') return `<div class="dim">&#128203; ${esc(l.msg)}</div>`;
        if (l.t === 'mypick') return `<div><b>Pick ${l.pick}: ${esc(l.player)}</b> ${(l.rules || []).map(r => `<span class="pill rule">${r}</span>`).join('')}${l.matchedPrimary ? ' <span class="pill" style="color:var(--good)">on script</span>' : ''}</div>`;
        if (l.t === 'pick') return `<div class="dim">Pick ${l.pick} - ${esc(l.team)}: ${esc(l.player)} (${esc(l.pos)})</div>`;

        save();
        render();
        toast('Imported');
      } catch (e) { alert('Import failed: ' + e.message); }
    };
  }

      const newSlot = meRadio ? +meRadio.dataset.me
        : Math.min(s.teams.length, Math.max(1, +g('set_slot').value || s.mySlot));
      const newRounds = Math.min(s.roundsMax, Math.max(s.roundsMin, +g('set_rounds').value || s.rounds));
      const newNames = {};
      sec.querySelectorAll('[data-slot]').forEach(inp => { newNames[+inp.dataset.slot] = inp.value.trim(); });
      const structuralChanged =
        newSlot !== s.mySlot || newRounds !== s.rounds ||
        s.teams.some(t => newNames[t.slot] && newNames[t.slot] !== t.name);

      const applyAll = () => {
        s.mySlot = newSlot;
        s.rounds = newRounds;
        s.teams.forEach(t => { if (newNames[t.slot]) t.name = newNames[t.slot]; });
        s.clockSeconds = +g('set_clock').value || 90;
        s.tierSize = +g('set_tier').value || 12;
        s.scarcityGap = +g('set_scarcity').value || 15;
        s.panicProb = +g('set_panic').value || 80;
        s.startable = { QB: +g('set_stQB').value || 15, RB: +g('set_stRB').value || 30, WR: +g('set_stWR').value || 36, TE: +g('set_stTE').value || 12 };
        s.survivalFactors = { likely: +g('set_survL').value || 1, coinflip: +g('set_survC').value || 0.5 };
        s.qb3Pick = +g('set_qb3').value || 130;
        s.simQB = {
          firstQBStart: +g('set_simQ1').value || 4,
          firstQBEnd: +g('set_simQ2').value || 9,
          secondQBAfter: +g('set_simQ3').value || 10
        };
        s.eliteQBs = g('set_elite').value.split(',').map(x => x.trim()).filter(Boolean);
        s.earlyTEs = g('set_earlyTE').value.split(',').map(x => x.trim()).filter(Boolean);
        if (!s.overlay) s.overlay = NS.overlay.defaults();
        s.overlay.dualThreatQBs = g('set_dualThreat').value.split(',').map(x => x.trim()).filter(Boolean);
        ['monteCarlo', 'roadmap', 'buildGuard', 'byeLoad', 'markers', 'resilience'].forEach(f => {
          s.flags[f] = g('flag_' + f).checked;
        });
        const byes = {};
        g('set_byes').value.split(/\r?\n/).forEach(line => {
          const m = line.trim().match(/^([A-Za-z]{2,3})\s+(\d+)$/);
          if (m) byes[m[1].toUpperCase()] = +m[2];
        });
        if (Object.keys(byes).length >= 30) s.byes = byes;
      };

      if (structuralChanged) {
        if (applySetupChange(applyAll)) toast('Settings saved - board recomputed');
      } else {
        act(() => { applyAll(); NS.store.recompute(S); });
        toast('Settings saved');
      }
    };

    sec.querySelector('#selfTestBtn').onclick = () => {
      const out = sec.querySelector('#selfTestOut');
      out.innerHTML = 'running...';
      setTimeout(() => {
        const results = NS.runSelfTests();
        const pass = results.filter(r => r.pass).length;
        out.innerHTML = `<div><b>${pass}/${results.length} passed</b></div>` +
          results.map(r => `<div class="${r.pass ? 'testPass' : 'testFail'}">${r.pass ? 'PASS' : 'FAIL'} ${esc(r.name)}${r.detail ? ' - ' + esc(r.detail) : ''}</div>`).join('');
      }, 30);
    };

    sec.querySelector('#espnExportBtn').onclick = () => {
      const out = sec.querySelector('#espnOut');
      out.value = NS.store.espnPreDraftList(S);
      out.style.display = 'block';
      try {
        const blob = new Blob([out.value], { type: 'text/plain' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = 'espn-predraft-list.txt';
        a.click();
      } catch (e) { /* iOS fallback: copy from the textarea */ }
      toast('Queue exported - active keepers stripped, K/DST at the bottom');
    };

    sec.querySelector('#roadmapBtn').onclick = () => {
      if (!s.flags.roadmap) return alert('Enable the A2 roadmap flag first (it runs 100 full mocks - a night-before tool).');
      const out = sec.querySelector('#roadmapOut');
      out.innerHTML = '<div class="dim">Running 100 mocks...</div>';
      setTimeout(() => {
        ui.roadmap = NS.sim.roadmap(S, 100);
        const rows = ui.roadmap.map(r =>
          `<tr><td>${r.pick}</td><td>${esc(r.primary)}</td>
           <td>${r.top3.map(c => `${esc(c.name)} ${c.pct}%`).join('<br>')}</td>
           <td class="mono">${['QB', 'RB', 'WR', 'TE'].map(p => `${p}${r.counts[p]}`).join(' ')}</td></tr>`).join('');
        const text = ui.roadmap.map(r => `Pick ${r.pick}: ${r.primary} | ${r.top3.map(c => `${c.name} ${c.pct}%`).join(', ')} | ` +
          ['QB', 'RB', 'WR', 'TE', 'K', 'DST'].map(p => `${p} ${r.counts[p]}`).join(', ')).join('\n');
        out.innerHTML = `<div class="tableWrap"><table><tr><th>Pick</th><th>Most common</th><th>Top 3</th><th>Counts after</th></tr>${rows}</table></div>
          <details><summary>Export as text</summary><textarea>${esc(text)}</textarea></details>`;
      }, 30);
    };

    sec.querySelector('#resetBtn').onclick = () => {
      if (!confirm('Reset EVERYTHING to defaults? Export first if unsure.')) return;
      if (!confirm('Really reset? This wipes the queue, board and log.')) return;
      S = NS.store.defaultState();
      save();
      render();
    };
  }

  // ---- SIMULATE tab ---------------------------------------------------------
  function renderSimTab(main) {
    const sec = document.createElement('section');
    sec.className = 'card';
    if (!S.sim) S.sim = NS.sim.freshSim(S, { seed: 20260826 });
    const shadow = NS.sim.shadow(S, S.sim);
    const cur = NS.board.currentPick(shadow);
    const myTurn = cur !== null && NS.board.teamForPick(shadow, cur) === NS.board.myTeamName(S.settings);

    sec.innerHTML = `<h2>Mock-draft simulator</h2>
      <div class="dim">Separate from live state. Opponents pick by ${(S.adp || []).length ? 'your pasted ADP' : 'your queue'} + need model + mild randomness.</div>
      <div class="fieldRow"><label>Protect list (sim never takes; comma-separated)</label></div>
      <textarea id="protectBox">${esc((S.sim.protect || []).join(', '))}</textarea>
      <div style="display:flex;gap:8px;flex-wrap:wrap;margin:8px 0">
        <button class="primaryBtn" id="simAuto">Auto-draft to my pick</button>
        <button class="dangerBtn" id="simReset">Reset sim</button>
      </div>
      <div id="simStatus">${cur === null ? '<b>Sim draft complete.</b>' :
        `<b>Sim pick ${cur}</b> - ${myTurn ? '<span style="color:var(--good)">YOUR PICK</span>' : esc(NS.board.teamForPick(shadow, cur))}`}</div>
      <div id="simRec"></div>
      <div id="simAvail"></div>
      <details><summary>Sim log (${S.sim.log.length})</summary>${S.sim.log.slice().reverse().map(l => `<div class="dim">${esc(l)}</div>`).join('')}</details>`;
    main.appendChild(sec);

    const saveProtect = () => {
      S.sim.protect = sec.querySelector('#protectBox').value.split(',').map(x => x.trim()).filter(Boolean);
    };
    sec.querySelector('#protectBox').onchange = () => { saveProtect(); save(); };
    sec.querySelector('#simAuto').onclick = () => {
      saveProtect();
      NS.sim.autoToMyPick(S, S.sim);
      save();
      render();
    };
    sec.querySelector('#simReset').onclick = () => {
      saveProtect();
      S.sim = NS.sim.freshSim(S, { seed: Math.floor(Math.random() * 1e9), protect: S.sim.protect });
      save();
      render();
    };

    if (myTurn) {
      const rec = NS.safeRecommend(shadow);
      const recHost = sec.querySelector('#simRec');
      if (rec.engineError) recHost.innerHTML = '<div class="banner red">engine error in sim - see console</div>';
      else if (rec.primary) {
        recHost.innerHTML = `<div class="recRow"><div class="recLabel">Primary</div><div class="pInfo">
          <div><span class="recName">${esc(rec.primary.player.name)}</span> <span class="pill">${rec.primary.player.pos}</span>
          ${rec.primary.why.rules.map(r => `<span class="pill rule">${r}</span>`).join('')}</div>
          <div class="recWhy">${esc(rec.primary.why.text)}</div></div></div>` +
          (rec.alt ? `<div class="dim">Alt: ${esc(rec.alt.player.name)}</div>` : '');
      }
      const availHost = sec.querySelector('#simAvail');
      NS.board.available(shadow).slice(0, 15).forEach(p => {
        const row = document.createElement('div');
        row.className = 'playerRow';
        row.innerHTML = `<div class="pInfo"><div class="pName">#${p.rank} ${esc(p.name)}</div><div class="pMeta">${p.pos}${p.team ? ' - ' + esc(p.team) : ''}</div></div>`;
        const b = document.createElement('button');
        b.className = 'small primaryBtn';
        b.textContent = 'Draft';
        b.onclick = () => { NS.sim.simMyPick(S, S.sim, p); save(); render(); };
        row.appendChild(b);
        availHost.appendChild(row);
      });
    }
  }

  // go (guard against booting twice)
  let booted = false;
  const bootOnce = () => { if (!booted) { booted = true; boot(); } };
  window.addEventListener('DOMContentLoaded', bootOnce);
  if (document.readyState !== 'loading') bootOnce();
})();

</script>
</body>
</html>
