<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0d1117">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon.svg">
<title>4th &amp; Optimized Draft OS</title>
<style>
/* Dark, phone-first, big tap targets. */
:root {
  --bg: #0d1117;
  --bg2: #161b22;
  --bg3: #1f2630;
  --line: #30363d;
  --fg: #e6edf3;
  --dim: #8b949e;
  --accent: #58a6ff;
  --good: #3fb950;
  --warn: #d29922;
  --bad: #f85149;
  --tap: 48px;
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { background: var(--bg); color: var(--fg); font: 16px/1.45 -apple-system, "SF Pro Text", Segoe UI, Roboto, sans-serif; }
body { padding-bottom: 76px; }
button, input, select, textarea { font: inherit; color: inherit; }
button {
  min-height: var(--tap); min-width: var(--tap);
  background: var(--bg3); border: 1px solid var(--line); border-radius: 10px;
  padding: 8px 14px; cursor: pointer;
}
button:active { background: #2b3542; }
button.primaryBtn { background: #1f6feb; border-color: #1f6feb; font-weight: 600; }
button.dangerBtn { background: #6e1a1a; border-color: var(--bad); }
button.small { min-height: 40px; min-width: 40px; padding: 4px 10px; font-size: 14px; }
input, select, textarea {
  background: var(--bg2); border: 1px solid var(--line); border-radius: 8px;
  padding: 10px; min-height: var(--tap);
}
textarea { width: 100%; min-height: 110px; font-family: ui-monospace, Menlo, monospace; font-size: 13px; }
h2 { font-size: 17px; margin: 4px 0 8px; }
h3 { font-size: 15px; margin: 6px 0 6px; color: var(--accent); }
.dim { color: var(--dim); font-size: 13px; }
.mono { font-family: ui-monospace, Menlo, monospace; }

/* Header */
#hdr {
  position: sticky; top: 0; z-index: 20; background: var(--bg2);
  border-bottom: 1px solid var(--line); padding: 8px 10px;
}
#hdrTop { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
#pickInfo { font-size: 15px; font-weight: 600; }
#pickInfo .sub { font-weight: 400; color: var(--dim); font-size: 13px; display: block; }
#clockWrap { display: flex; align-items: center; gap: 6px; }
#clock { font-size: 34px; font-weight: 700; font-variant-numeric: tabular-nums; min-width: 104px; text-align: center; }
#clock.low { color: var(--bad); animation: blink 1s step-end infinite; }
@keyframes blink { 50% { opacity: 0.35; } }
#hdrBtns { display: flex; gap: 8px; margin-top: 6px; }
#ghostBtn.on { background: #4c2889; border-color: #8957e5; }

/* Sections */
section.card {
  background: var(--bg2); border: 1px solid var(--line); border-radius: 12px;
  margin: 10px; padding: 12px;
}
.banner { border-radius: 10px; padding: 10px 12px; margin: 10px; font-weight: 600; }
.banner.red { background: #67060c; border: 1px solid var(--bad); }
.banner.amber { background: #4d3800; border: 1px solid var(--warn); }
.banner.purple { background: #3c2470; border: 1px solid #8957e5; }

/* Rec card */
#recCard.frozen { opacity: 0.45; filter: grayscale(0.8); }
.recRow { display: flex; align-items: flex-start; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--line); }
.recRow:last-child { border-bottom: none; }
.recLabel { flex: 0 0 62px; font-size: 12px; font-weight: 700; color: var(--dim); text-transform: uppercase; padding-top: 4px; }
.recName { font-size: 18px; font-weight: 700; }
.recWhy { font-size: 13px; color: var(--dim); }
.pill {
  display: inline-block; font-size: 11px; font-weight: 700; border-radius: 999px;
  padding: 2px 8px; margin-left: 6px; vertical-align: middle;
  background: var(--bg3); border: 1px solid var(--line);
}
.pill.rule { background: #0d419d; border-color: var(--accent); }
.pill.money { background: #1a4d2e; border-color: var(--good); }
.pill.fade { background: #5a1e02; border-color: var(--warn); }
.pill.inj { background: #67060c; border-color: var(--bad); }
.pill.star { background: #4d3800; border-color: var(--warn); }
.pill.stack { background: #0f3058; border-color: var(--accent); }
.pill.surv-likely { color: var(--good); }
.pill.surv-coin { color: var(--warn); }
.pill.surv-gone { color: var(--bad); }

/* Available list */
#posChips { display: flex; gap: 6px; overflow-x: auto; padding: 6px 0; }
#posChips button { min-height: 40px; min-width: 52px; }
#posChips button.on { background: #1f6feb; border-color: #1f6feb; }
.playerRow {
  display: flex; align-items: center; gap: 8px; padding: 6px 0;
  border-bottom: 1px solid var(--line);
}
.playerRow .pInfo { flex: 1; min-width: 0; }
.playerRow .pName { font-weight: 600; }
.playerRow .pMeta { font-size: 12px; color: var(--dim); }
.playerRow button { flex-shrink: 0; }

/* Roster */
#rosterGrid { display: grid; grid-template-columns: 56px 1fr; gap: 4px 10px; font-size: 14px; }
#rosterGrid .slot { color: var(--dim); font-weight: 700; font-size: 12px; padding-top: 2px; }
.countChips { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0; }
.byeGrid { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.byeCell { background: var(--bg3); border: 1px solid var(--line); border-radius: 8px; padding: 4px 8px; font-size: 12px; }
.byeCell.hot { border-color: var(--bad); color: var(--bad); font-weight: 700; }

/* Tables */
table { border-collapse: collapse; width: 100%; font-size: 13px; }
th, td { border: 1px solid var(--line); padding: 5px 7px; text-align: left; }
th { background: var(--bg3); }
.tableWrap { overflow-x: auto; }

/* Queue editor */
.qRow { display: flex; align-items: center; gap: 6px; padding: 4px 0; border-bottom: 1px solid var(--line); }
.qRow .qName { flex: 1; min-width: 0; }
.qRow.tierHead { background: var(--bg3); font-weight: 700; padding: 6px 8px; border-radius: 6px; }
.badge { font-size: 10px; background: #67060c; border-radius: 4px; padding: 1px 5px; margin-left: 4px; }

/* Tab bar */
#tabbar {
  position: fixed; bottom: 0; left: 0; right: 0; z-index: 30;
  display: flex; overflow-x: auto; background: var(--bg2);
  border-top: 1px solid var(--line); padding: 4px 4px calc(4px + env(safe-area-inset-bottom));
}
#tabbar button {
  flex: 1 0 auto; border: none; background: none; border-radius: 8px;
  font-size: 12px; padding: 6px 10px; min-width: 60px; color: var(--dim);
}
#tabbar button.on { color: var(--accent); background: var(--bg3); font-weight: 700; }

.fieldRow { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 7px 0; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.fieldRow label { flex: 1; min-width: 140px; }
.fieldRow input[type="number"], .fieldRow input[type="text"] { width: 110px; }
.fieldRow input[type="checkbox"] { width: 26px; height: 26px; }

details { margin: 8px 0; }
summary { min-height: var(--tap); display: flex; align-items: center; cursor: pointer; font-weight: 600; }
.testPass { color: var(--good); }
.testFail { color: var(--bad); font-weight: 700; }
#toast {
  position: fixed; bottom: 84px; left: 50%; transform: translateX(-50%);
  background: #1f6feb; color: #fff; border-radius: 10px; padding: 10px 16px;
  z-index: 50; font-weight: 600; max-width: 92vw; text-align: center;
  transition: opacity 0.3s; opacity: 0; pointer-events: none;
}
#toast.show { opacity: 1; }
@media (min-width: 760px) {
  #main { max-width: 900px; margin: 0 auto; }
}

</style>
</head>
<body>
<header id="hdr">
  <div id="hdrTop">
    <div id="pickInfo"></div>
    <div id="clockWrap">
      <div id="clock">1:30</div>
      <button class="small" id="clockStart">&#9654;</button>
      <button class="small" id="clockPause">&#10073;&#10073;</button>
      <button class="small" id="clockReset">&#8634;</button>
    </div>
  </div>
  <div id="hdrBtns">
    <button id="ghostBtn">GHOST MODE</button>
    <button id="undoBtn">Undo</button>
  </div>
</header>
<div id="main"></div>
<nav id="tabbar"></nav>
<div id="toast"></div>
<script>
/* ===== js/core.js ===== */
// Shared namespace + tiny utilities. Every module attaches to globalThis.DraftOS
// and (in Node) exports the same namespace, so browser <script> concat and
// require() both work with zero tooling.
(function () {
  const NS = globalThis.DraftOS || (globalThis.DraftOS = {});

  NS.clone = obj => JSON.parse(JSON.stringify(obj));

  // Deterministic RNG (mulberry32) so simulator tests are reproducible.
  NS.makeRng = function (seed) {
    let a = seed >>> 0;
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  };

  NS.POSITIONS = ['QB', 'RB', 'WR', 'TE', 'K', 'DST'];
  NS.SKILL = ['RB', 'WR', 'TE'];

  if (typeof module !== 'undefined' && module.exports) module.exports = NS;
})();

/* ===== js/data.js ===== */
// League facts. Everything here is a DEFAULT — Settings can edit teams,
// keepers, byes, thresholds. Nothing is fetched from the network, ever.
(function () {
  const NS = globalThis.DraftOS;

  NS.DATA = {};

  NS.DATA.TEAMS = [
    { slot: 1, name: 'Colby' },
    { slot: 2, name: 'Mike' },
    { slot: 3, name: 'Chris' },
    { slot: 4, name: 'Rob' },
    { slot: 5, name: 'Andrew' },
    { slot: 6, name: 'Hugo' },
    { slot: 7, name: 'Jeff K' },
    { slot: 8, name: 'Nolan' },
    { slot: 9, name: 'Bibhor' },
    { slot: 10, name: 'Oskar' }
  ];

  NS.DATA.MY_SLOT = 7;
  NS.DATA.ROUNDS = 19;
  NS.DATA.TEAM_COUNT = 10;

  // Keeper pick numbers are re-derived from the snake formula and asserted
  // against these values in the tests.
  NS.DATA.KEEPERS = [
    { team: 'Andrew', player: 'Bijan Robinson', pos: 'RB', nfl: 'ATL', round: 1, pick: 5 },
    { team: 'Jeff K', player: 'Josh Allen', pos: 'QB', nfl: 'BUF', round: 3, pick: 27 },
    { team: 'Nolan', player: 'Brock Bowers', pos: 'TE', nfl: 'LV', round: 3, pick: 28 },
    { team: 'Hugo', player: 'Jaxon Smith-Njigba', pos: 'WR', nfl: 'SEA', round: 4, pick: 35 },
    { team: 'Oskar', player: 'Drake Maye', pos: 'QB', nfl: 'NE', round: 6, pick: 51 },
    { team: 'Colby', player: 'Jayden Daniels', pos: 'QB', nfl: 'WAS', round: 8, pick: 80 },
    { team: 'Bibhor', player: 'Rashee Rice', pos: 'WR', nfl: 'KC', round: 10, pick: 92 },
    { team: 'Chris', player: 'Colston Loveland', pos: 'TE', nfl: 'CHI', round: 15, pick: 143 },
    { team: 'Rob', player: 'Quinshon Judkins', pos: 'RB', nfl: 'CLE', round: 16, pick: 157 },
    { team: 'Mike', player: 'Luther Burden III', pos: 'WR', nfl: 'CHI', round: 16, pick: 159 }
  ];

  // 2026 team bye weeks. The table always wins over a pasted bye column.
  NS.DATA.BYES = {
    ARI: 14, ATL: 11, BAL: 13, BUF: 7, CAR: 5, CHI: 10, CIN: 6, CLE: 11,
    DAL: 14, DEN: 10, DET: 6, GB: 11, HOU: 8, IND: 13, JAX: 7, KC: 5,
    LAC: 7, LAR: 11, LV: 13, MIA: 6, MIN: 6, NE: 11, NO: 8, NYG: 8,
    NYJ: 13, PHI: 10, PIT: 9, SEA: 11, SF: 8, TB: 10, TEN: 9, WAS: 7
  };

  NS.DATA.QB2_POOL = [
    'Dak Prescott', 'Trevor Lawrence', 'Jaxson Dart', 'Patrick Mahomes',
    'Bo Nix', 'Brock Purdy', 'Justin Herbert'
  ];

  NS.DATA.IR_LATE = ['Jordyn Tyson', 'Zach Charbonnet', 'Alvin Kamara'];       // pick 147+
  NS.DATA.IR_SEASON_END = ['Jayden Higgins', 'Ricky Pearsall'];                // pick 187 only

  NS.DATA.INJURY_TAGS = [
    { name: 'Josh Allen', tag: 'bye 7' },
    { name: 'Justin Herbert', tag: 'bye 7' },
    { name: "Ja'Marr Chase", tag: 'knee (monitor)' },
    { name: 'Christian McCaffrey', tag: 'load-manage' },
    { name: 'Malik Nabers', tag: 'ACL rehab' },
    { name: 'Kenneth Walker', tag: 'foot' },
    { name: 'Ashton Jeanty', tag: 'ankle' },
    { name: 'Patrick Mahomes', tag: 'ACL return' },
    { name: 'Zach Charbonnet', tag: 'PUP / Price SEA lead back' },
    { name: 'Jordyn Tyson', tag: 'hamstring IR-likely' },
    { name: 'Alec Pierce', tag: 'ankle/PUP' },
    { name: 'George Kittle', tag: 'Achilles' },
    { name: 'Jordan Love', tag: 'ankle' }
  ];

  NS.DATA.SCORING_TEXT =
    '6-pt pass TD - 6-pt rush/rec TD - 1 PPR - +3 for a 40+ yd completion - ' +
    '+3 for a 40+ yd reception - DST points-allowed tiers - FG 3/4/5 by distance - PAT 1. ' +
    '(Reference only - this app has no points engine.)';

  NS.DATA.SAMPLE_QUEUE_TEXT = [
    'TIER 1',
    '1. Jahmyr Gibbs RB DET 6',
    "2. Ja'Marr Chase WR CIN 6",
    '3. Puka Nacua WR LAR 11',
    '4. Christian McCaffrey RB SF 8',
    '5. Jonathan Taylor RB IND 13',
    '6. Amon-Ra St. Brown WR DET 6',
    '7. James Cook RB BUF 7',
    '8. CeeDee Lamb WR DAL 14',
    'TIER 2',
    '9. Lamar Jackson QB BAL 13',
    '10. Justin Jefferson WR MIN 6',
    "11. De'Von Achane RB MIA 6",
    '12. Drake London WR ATL 11',
    '13. Chase Brown RB CIN 6',
    '14. Omarion Hampton RB LAC 7',
    '15. Trey McBride TE ARI 14',
    '16. Saquon Barkley RB PHI 10',
    '17. A.J. Brown WR NE 11',
    '18. Nico Collins WR HOU 8',
    '19. Ashton Jeanty RB LV 13',
    '20. George Pickens WR DAL 14',
    'TIER 3',
    '21. Derrick Henry RB BAL 13',
    '22. Jalen Hurts QB PHI 10',
    '23. Joe Burrow QB CIN 6',
    '24. Caleb Williams QB CHI 10',
    '25. Dak Prescott QB DAL 14'
  ].join('\n');

  // Filler rows extend the sample so a mock draft can reach pick 34+.
  // Removed automatically the moment a real queue is pasted (paste replaces all).
  NS.DATA.buildFillers = function () {
    const teams = Object.keys(NS.DATA.BYES);
    const cycle = ['RB', 'WR', 'WR', 'RB', 'TE', 'QB'];
    const out = [];
    for (let rank = 26; rank <= 60; rank++) {
      let pos;
      if (rank === 55 || rank === 57) pos = 'K';
      else if (rank === 56 || rank === 58) pos = 'DST';
      else pos = cycle[(rank - 26) % cycle.length];
      const team = teams[(rank - 26) % teams.length];
      out.push({
        rank, name: `Filler ${pos} ${rank}`, pos, team,
        bye: NS.DATA.BYES[team], tier: 3 + Math.ceil((rank - 25) / 12),
        tags: ['filler'], filler: true
      });
    }
    return out;
  };

  if (typeof module !== 'undefined' && module.exports) module.exports = NS;
})();

/* ===== js/normalize.js ===== */
// Name normalization + fuzzy matching. Used by every paste path.
// Never silently drops a low-confidence match — callers get a suggestion.
(function () {
  const NS = globalThis.DraftOS;

  const SUFFIXES = new Set(['jr', 'sr', 'ii', 'iii', 'iv', 'v']);

  // "Chase, Ja'Marr" -> "Ja'Marr Chase"; case/punct/suffix-insensitive key.
  NS.normName = function (raw) {
    let s = String(raw || '').trim();
    // "Last, First" (a single comma with words on both sides, no digits)
    const m = s.match(/^([^,\d]+),\s*([^,\d]+)$/);
    if (m) s = `${m[2]} ${m[1]}`;
    s = s.toLowerCase()
      .replace(/[.'’]/g, '')     // periods + apostrophes vanish: A.J. -> aj, Ja'Marr -> jamarr
      .replace(/[^a-z0-9]+/g, ' ')    // everything else becomes a space
      .trim();
    const toks = s.split(' ').filter(t => t && !SUFFIXES.has(t));
    return toks.join(' ');
  };

  function levenshtein(a, b) {
    if (a === b) return 0;
    const dp = Array.from({ length: a.length + 1 }, (_, i) => [i]);
    for (let j = 0; j <= b.length; j++) dp[0][j] = j;
    for (let i = 1; i <= a.length; i++) {
      for (let j = 1; j <= b.length; j++) {
        dp[i][j] = Math.min(
          dp[i - 1][j] + 1, dp[i][j - 1] + 1,
          dp[i - 1][j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1)
        );
      }
    }
    return dp[a.length][b.length];
  }
  NS.levenshtein = levenshtein;

  // Match a pasted name against a list of {name, normName}.
  // -> {kind:'exact'|'suggest'|'none', player?, suggestions?}
  NS.matchName = function (raw, players) {
    const key = NS.normName(raw);
    if (!key) return { kind: 'none', suggestions: [] };
    const exact = players.find(p => p.normName === key);
    if (exact) return { kind: 'exact', player: exact };
    // substring containment (e.g. "gibbs" or "jahmyr gibbs det")
    const contains = players.filter(p =>
      p.normName.includes(key) || key.includes(p.normName));
    if (contains.length === 1) return { kind: 'exact', player: contains[0] };
    // fuzzy: small edit distance relative to length
    const scored = players
      .map(p => ({ p, d: levenshtein(key, p.normName) }))
      .filter(x => x.d <= Math.max(2, Math.floor(key.length / 4)))
      .sort((a, b) => a.d - b.d);
    if (scored.length && scored[0].d <= 2 && (!scored[1] || scored[1].d > scored[0].d)) {
      return { kind: 'exact', player: scored[0].p };
    }
    const sugg = (contains.length ? contains : scored.map(x => x.p)).slice(0, 3);
    return { kind: sugg.length ? 'suggest' : 'none', suggestions: sugg };
  };

  if (typeof module !== 'undefined' && module.exports) module.exports = NS;
})();

/* ===== js/pickorder.js ===== */
// Pure snake-draft pick-order engine with keepers pre-filled.
(function () {
  const NS = globalThis.DraftOS;
  const PO = NS.pickorder = {};

  // odd round: (r-1)*10 + slot ; even round: (r-1)*10 + 11 - slot
  PO.pickForSlotRound = function (slot, round, teamCount) {
    const n = teamCount || 10;
    return round % 2 === 1
      ? (round - 1) * n + slot
      : (round - 1) * n + (n + 1) - slot;
  };

  PO.slotForPick = function (pick, teamCount) {
    const n = teamCount || 10;
    const round = Math.ceil(pick / n);
    const idx = pick - (round - 1) * n; // 1..n within the round
    return { round, slot: round % 2 === 1 ? idx : (n + 1) - idx };
  };

  // -> array of {pick, round, slot, team, keeper:null|{player,pos,nfl,team}}
  PO.buildOrder = function (settings) {
    const teams = settings.teams;
    const n = teams.length;
    const total = n * settings.rounds;
    const bySlot = {};
    teams.forEach(t => { bySlot[t.slot] = t.name; });
    const keeperByPick = {};
    (settings.keepers || []).forEach(k => { keeperByPick[k.pick] = k; });
    const order = [];
    for (let pick = 1; pick <= total; pick++) {
      const { round, slot } = PO.slotForPick(pick, n);
      order.push({
        pick, round, slot, team: bySlot[slot],
        keeper: keeperByPick[pick] || null
      });
    }
    return order;
  };

  // All pick numbers belonging to my slot, split into keeper vs live.
  PO.myPicks = function (settings) {
    const order = PO.buildOrder(settings);
    const mine = order.filter(o => o.slot === settings.mySlot);
    return {
      all: mine.map(o => o.pick),
      live: mine.filter(o => !o.keeper).map(o => o.pick),
      keeper: mine.filter(o => o.keeper).map(o => o.pick)
    };
  };

  // Next live (non-keeper) pick of mine at or after `fromPick`.
  PO.myNextLivePick = function (settings, fromPick) {
    return PO.myPicks(settings).live.find(p => p >= fromPick) || null;
  };

  // Live picks strictly between two pick numbers (exclusive/exclusive),
  // i.e. how many other teams pick before my turn.
  PO.livePicksBetween = function (settings, fromPickExclusive, toPickExclusive) {
    const order = PO.buildOrder(settings);
    return order.filter(o =>
      o.pick > fromPickExclusive && o.pick < toPickExclusive && !o.keeper).length;
  };

  if (typeof module !== 'undefined' && module.exports) module.exports = NS;
})();

/* ===== js/parser.js ===== */
// Lenient parsers for every paste box. Pure functions, no DOM.
(function () {
  const NS = globalThis.DraftOS;
  const P = NS.parser = {};

  const POS_SET = new Set(['QB', 'RB', 'WR', 'TE', 'K', 'DST', 'DEF', 'D/ST', 'PK']);
  const normPos = p => {
    const u = String(p || '').toUpperCase();
    if (u === 'DEF' || u === 'D/ST') return 'DST';
    if (u === 'PK') return 'K';
    return u;
  };

  P.isTierBreak = function (line) {
    const t = line.trim();
    if (/^-{3,}$/.test(t) || /^={3,}$/.test(t)) return { tier: null };
    const m = t.match(/^tier\s*(\d+)\s*$/i);
    if (m) return { tier: parseInt(m[1], 10) };
    return null;
  };

  // Parse one queue line -> {rank, name, pos, team, bye} (pos/team/bye optional).
  P.parseQueueLine = function (line, byes) {
    const t = line.trim();
    if (!t) return null;
    let rank = null, name = '', pos = '', team = '', bye = null;
    const teamKeys = new Set(Object.keys(byes || {}));

    if (t.includes(',') && /^\d+\s*[.,]?/.test(t)) {
      // "12, Jahmyr Gibbs, RB, DET, 6"
      const parts = t.split(',').map(s => s.trim()).filter(s => s !== '');
      rank = parseInt(parts[0], 10);
      name = parts[1] || '';
      for (const part of parts.slice(2)) {
        const u = part.toUpperCase();
        if (POS_SET.has(u)) pos = normPos(u);
        else if (teamKeys.has(u)) team = u;
        else if (/^\d+$/.test(part)) bye = parseInt(part, 10);
        else if (!name) name = part;
      }
    } else {
      // "12. Jahmyr Gibbs" or "12 Jahmyr Gibbs RB DET 6"
      const m = t.match(/^(\d+)\s*[.)]?\s+(.*)$/);
      if (!m) return null;
      rank = parseInt(m[1], 10);
      let toks = m[2].split(/\s+/);
      // consume pos/team/bye off the tail, in any order
      let consumed = true;
      while (consumed && toks.length > 1) {
        consumed = false;
        const lastRaw = toks[toks.length - 1];
        const last = lastRaw.toUpperCase();
        if (bye === null && /^\d+$/.test(lastRaw)) { bye = parseInt(lastRaw, 10); toks.pop(); consumed = true; }
        else if (!team && teamKeys.has(last)) { team = last; toks.pop(); consumed = true; }
        else if (!pos && POS_SET.has(last)) { pos = normPos(last); toks.pop(); consumed = true; }
      }
      name = toks.join(' ');
    }
    if (!name || rank === null || isNaN(rank)) return null;
    return { rank, name, pos, team, bye };
  };

  // Full queue paste -> {players, strippedKeepers, warnings}
  // Tier breaks honored; without any, tiers default to blocks of `tierSize`.
  P.parseQueue = function (text, opts) {
    const byes = opts.byes;
    const keepers = opts.keepers || [];
    const tierSize = opts.tierSize || 12;
    const keeperKeys = new Set(keepers.map(k => NS.normName(k.player)));

    const players = [];
    const strippedKeepers = [];
    const warnings = [];
    let tier = 1, sawBreak = false;

    for (const line of String(text).split(/\r?\n/)) {
      const tb = P.isTierBreak(line);
      if (tb) {
        sawBreak = true;
        if (tb.tier !== null) tier = tb.tier;          // "TIER n"
        else if (players.length) tier += 1;            // "---" / "==="
        continue;
      }
      const p = P.parseQueueLine(line, byes);
      if (!p) {
        if (line.trim()) warnings.push({ line: line.trim(), reason: 'unparsed' });
        continue;
      }
      const key = NS.normName(p.name);
      if (keeperKeys.has(key)) { strippedKeepers.push(p.name); continue; }

      const badges = [];
      if (!p.pos) badges.push('needs data');
      if (!p.team) { if (!badges.includes('needs data')) badges.push('needs data'); }
      // Bye table always wins over a pasted bye column.
      if (p.team && byes[p.team] !== undefined) {
        if (p.bye !== null && p.bye !== byes[p.team]) badges.push('bye mismatch');
        p.bye = byes[p.team];
      } else if (p.bye === null) {
        if (!badges.includes('needs data')) badges.push('needs data');
      }
      players.push({
        rank: p.rank, name: p.name, normName: key, pos: p.pos, team: p.team,
        bye: p.bye, tier, tags: badges, marker: null, handcuffOf: null
      });
    }
    if (!sawBreak) {
      players.forEach(p => { p.tier = Math.ceil(p.rank / tierSize); });
    }
    players.sort((a, b) => a.rank - b.rank);
    return { players, strippedKeepers, warnings };
  };

  // ADP / FantasyPros paste: "rank name" per line. Availability/compare only.
  P.parseRankList = function (text, opts) {
    const keeperKeys = new Set(((opts && opts.keepers) || []).map(k => NS.normName(k.player)));
    const out = [];
    for (const line of String(text).split(/\r?\n/)) {
      const t = line.trim();
      if (!t) continue;
      const m = t.match(/^(\d+)\s*[.)]?\s*[,]?\s*(.+)$/);
      if (!m) continue;
      const name = m[2].split(',')[0].trim();
      const key = NS.normName(name);
      if (keeperKeys.has(key)) continue; // keepers stripped from every paste
      out.push({ rank: parseInt(m[1], 10), name, normName: key });
    }
    return out;
  };

  // Props: "PLAYER | PROP TYPE | LINE | NOTE"
  P.parseProps = function (text, opts) {
    const keeperKeys = new Set(((opts && opts.keepers) || []).map(k => NS.normName(k.player)));
    const out = [];
    for (const line of String(text).split(/\r?\n/)) {
      const t = line.trim();
      if (!t) continue;
      const parts = t.split('|').map(s => s.trim());
      if (parts.length < 2) continue;
      const [player, type, lineVal, note] = [parts[0], parts[1] || '', parts[2] || '', parts[3] || ''];
      const key = NS.normName(player);
      if (keeperKeys.has(key)) continue;
      const blob = `${type} ${lineVal} ${note}`.toLowerCase();
      let tag = null;
      if (/\b(over|sharp|volume)\b/.test(blob)) tag = 'money edge';
      if (/\b(under|fade)\b/.test(blob)) tag = 'fade';
      out.push({ player, normName: key, type, line: lineVal, note, tag });
    }
    return out;
  };

  // Catch-up paste: comma- or line-separated player names, in pick order.
  // With newlines, each line is one name (so "Last, First" lines survive);
  // a single line is split on commas.
  P.parseCatchup = function (text) {
    const s = String(text).trim();
    const parts = /\r?\n/.test(s) ? s.split(/\r?\n/) : s.split(',');
    return parts
      .map(x => x.trim().replace(/^\d+\s*[.)]?\s*/, ''))
      .filter(Boolean);
  };

  if (typeof module !== 'undefined' && module.exports) module.exports = NS;
})();

// Board tracker: who picked what, what's left, team tendencies. Pure functions.
(function () {
  const NS = globalThis.DraftOS;
  const B = NS.board = {};

  // Keeper picks are pre-filled into state.picks at init, so "current pick"
  // (first unfilled pick number) naturally skips them on the clock.
  B.keeperPickEntries = function (settings) {
    return (settings.keepers || []).map(k => ({
      pick: k.pick, team: k.team, player: k.player, pos: k.pos || '',
      normName: NS.normName(k.player), keeper: true,
      byMe: k.team === B.myTeamName(settings)
    })).sort((a, b) => a.pick - b.pick);
  };

  B.myTeamName = function (settings) {
    const t = settings.teams.find(t => t.slot === settings.mySlot);
    return t ? t.name : 'Jeff K';
  };

  B.totalPicks = s => s.settings.teams.length * s.settings.rounds;

  B.currentPick = function (state) {
    const filled = new Set(state.picks.map(p => p.pick));
    const total = B.totalPicks(state);
    for (let p = 1; p <= total; p++) if (!filled.has(p)) return p;
    return null; // draft over
  };

  B.isMyPick = function (state, pick) {
    const { slot } = NS.pickorder.slotForPick(pick, state.settings.teams.length);
    return slot === state.settings.mySlot;
  };

  B.teamForPick = function (state, pick) {
    const { slot } = NS.pickorder.slotForPick(pick, state.settings.teams.length);
    const t = state.settings.teams.find(t => t.slot === slot);
    return t ? t.name : '?';
  };

  B.pickedKeys = function (state) {
    const keys = new Set(state.picks.map(p => p.normName));
    (state.settings.keepers || []).forEach(k => keys.add(NS.normName(k.player)));
    return keys;
  };

  // Remaining players in my queue order. Keepers can never appear here.
  B.available = function (state) {
    const gone = B.pickedKeys(state);
    return state.myQueue.filter(p => !gone.has(p.normName));
  };

  B.myRoster = function (state) {
    const me = B.myTeamName(state.settings);
    return state.picks.filter(p => p.byMe || p.team === me)
      .sort((a, b) => a.pick - b.pick);
  };

  B.posCounts = function (players) {
    const c = { QB: 0, RB: 0, WR: 0, TE: 0, K: 0, DST: 0, other: 0 };
    players.forEach(p => { (c[p.pos] !== undefined) ? c[p.pos]++ : c.other++; });
    return c;
  };

  // Per-team positional counts. Keepers count from pick 1 (they're locked in).
  B.teamCounts = function (state) {
    const out = {};
    state.settings.teams.forEach(t => { out[t.name] = { QB: 0, RB: 0, WR: 0, TE: 0, K: 0, DST: 0 }; });
    state.picks.forEach(p => {
      if (out[p.team] && out[p.team][p.pos] !== undefined) out[p.team][p.pos]++;
    });
    return out;
  };

  // Catch-up paste: assign names to teams by walking the pick order from the
  // current pick, skipping already-filled (keeper) picks.
  // -> {assignments:[{pick,team,player,pos,normName,byMe}], unmatched:[{name,suggestions}]}
  B.assignCatchup = function (state, names) {
    const total = B.totalPicks(state);
    const filled = new Set(state.picks.map(p => p.pick));
    const avail = B.available(state).slice();
    const me = B.myTeamName(state.settings);
    const assignments = [], unmatched = [];
    let pick = B.currentPick(state);
    for (const raw of names) {
      while (pick !== null && pick <= total && filled.has(pick)) pick++;
      if (pick === null || pick > total) break;
      const m = NS.matchName(raw, avail);
      if (m.kind !== 'exact') {
        unmatched.push({ name: raw, suggestions: (m.suggestions || []).map(s => s.name) });
        continue; // never a silent drop; do not consume the pick
      }
      const team = B.teamForPick(state, pick);
      assignments.push({
        pick, team, player: m.player.name, pos: m.player.pos,
        normName: m.player.normName, keeper: false, byMe: team === me
      });
      avail.splice(avail.indexOf(m.player), 1);
      filled.add(pick);
      pick++;
    }
    return { assignments, unmatched };
  };

  // "RB run in progress" - 3+ of the last 5 live picks share a position.
  // Plus the TE-specific early warning.
  B.runDetection = function (state) {
    const alerts = [];
    const live = state.picks.filter(p => !p.keeper).sort((a, b) => a.pick - b.pick);
    const last5 = live.slice(-5);
    const counts = B.posCounts(last5);
    for (const pos of ['QB', 'RB', 'WR', 'TE']) {
      if (counts[pos] >= 3) alerts.push(`${pos} run in progress (${counts[pos]} of last 5 picks)`);
    }
    // TE will run: top-2 TEs in my queue gone and 6+ teams still have 0 TE
    const queueTEs = state.myQueue.filter(p => p.pos === 'TE').sort((a, b) => a.rank - b.rank);
    const gone = B.pickedKeys(state);
    const top2Gone = queueTEs.slice(0, 2).length === 2 &&
      queueTEs.slice(0, 2).every(t => gone.has(t.normName));
    const tc = B.teamCounts(state);
    const zeroTE = Object.values(tc).filter(c => c.TE === 0).length;
    if (top2Gone && zeroTE >= 6) alerts.push(`TE will run (top-2 TEs gone, ${zeroTE} teams with 0 TE)`);
    return alerts;
  };

  // "N teams could take a QB before pick 34" - teams with 0-1 QBs holding a
  // pick between now and pick 34.
  B.qb2Competition = function (state) {
    const cur = B.currentPick(state);
    if (cur === null || cur > 34) return null;
    const tc = B.teamCounts(state);
    const me = B.myTeamName(state.settings);
    const order = NS.pickorder.buildOrder(state.settings);
    const filled = new Set(state.picks.map(p => p.pick));
    const teams = new Set();
    order.forEach(o => {
      if (o.pick >= cur && o.pick < 34 && !filled.has(o.pick) && o.team !== me) {
        if ((tc[o.team].QB || 0) <= 1) teams.add(o.team);
      }
    });
    return teams.size;
  };

  // Opponent-need model: relative weight that a team takes each position with
  // its next pick. Superflex pushes QB demand up hard while a team is short.
  B.needWeights = function (counts, round, settings) {
    const w = { QB: 0, RB: 0, WR: 0, TE: 0, K: 0, DST: 0 };
    const qd = (settings && settings.simQB) || { firstQBIn4: 0.7, secondQBByR8: 0.5 };
    // QB: superflex demand
    if (counts.QB === 0) w.QB = round <= 4 ? (2.5 * qd.firstQBIn4) : 2.0;
    else if (counts.QB === 1) w.QB = round <= 8 ? (1.2 * qd.secondQBByR8) : 0.8;
    else if (counts.QB === 2) w.QB = 0.15;
    else w.QB = 0.03;
    // RB/WR toward typical builds
    w.RB = Math.max(0.25, 1.4 - counts.RB * 0.25);
    w.WR = Math.max(0.25, 1.4 - counts.WR * 0.22);
    // TE
    w.TE = counts.TE === 0 ? (round >= 3 ? 0.6 : 0.35) : (counts.TE === 1 ? 0.1 : 0.03);
    // K/DST only late
    if (round >= 17) { w.K = counts.K === 0 ? 0.9 : 0; w.DST = counts.DST === 0 ? 0.9 : 0; }
    else if (round >= 15) { w.K = counts.K === 0 ? 0.15 : 0; w.DST = counts.DST === 0 ? 0.15 : 0; }
    return w;
  };

  if (typeof module !== 'undefined' && module.exports) module.exports = NS;
})();

// The 10 hard playbook rules. Every recommendation cites ruleIds from here.
(function () {
  const NS = globalThis.DraftOS;
  const PB = NS.playbook = {};

  PB.RULES = [
    { ruleId: 'R1', label: 'Early picks are skill only', text: 'Picks 7 and 14 = RB/WR/TE only. EXCEPTION: take Lamar Jackson if available at 14.' },
    { ruleId: 'R2', label: 'Pick 34 = QB2', text: 'Pick 34 = QB2 by default from the pool. Fallen elite skill player only if a full tier above the remaining pool QBs AND 3+ startable QBs remain.' },
    { ruleId: 'R3', label: 'Week 7 QB collision', text: 'Any QB2 with a Week 7 bye collides with Allen. If QB2 has bye 7, force QB3 by pick 74 - recs at 67 and 74 must be a QB unless QB3 is already rostered.' },
    { ruleId: 'R4', label: 'Target build', text: '3 QB (4th only at pick 134+), 5 RB, 6 WR, 1 TE (2 only if both are top-6 TEs), 1 K, 1 DST.' },
    { ruleId: 'R5', label: 'No mid-tier TE2', text: 'TE2 is never a Freiermuth/Njoku/Kelce-tier player over a needed WR/RB/QB3.' },
    { ruleId: 'R6', label: 'K/DST timing', text: 'K and DST only at picks 174 and 187. Never a second K or DST.' },
    { ruleId: 'R7', label: 'IR stash timing', text: 'IR stashes only at pick 147+. Season-ending names only at pick 187.' },
    { ruleId: 'R8', label: 'Fill the empty side', text: 'After pick 34, with 0 WR or 0 RB, the next two skill picks lean the empty side unless a player is 10+ ranks better.' },
    { ruleId: 'R9', label: 'Value beats need', text: 'Value beats need when the player is a full tier above anyone at a needy spot.' },
    { ruleId: 'R10', label: 'Props never override', text: 'Props/Vegas tags never override rules 1-3 at picks 7, 14, 34.' }
  ];

  PB.ruleById = id => PB.RULES.find(r => r.ruleId === id);

  const LAMAR = 'lamar jackson';

  // My K/DST picks: my last two live picks (174 and 187 with default settings).
  PB.kdstPicks = function (settings) {
    const live = NS.pickorder.myPicks(settings).live;
    return live.slice(-2);
  };

  // Position rank inside the FULL queue (1 = best QB in my queue, etc.).
  PB.posRankMap = function (queue) {
    const map = {};
    const byPos = {};
    queue.slice().sort((a, b) => a.rank - b.rank).forEach(p => {
      byPos[p.pos] = (byPos[p.pos] || 0) + 1;
      map[p.normName] = byPos[p.pos];
    });
    return map;
  };

  // Startable = within the per-position threshold, counted within my queue.
  PB.startableRemaining = function (state, available) {
    const th = state.settings.startable; // {QB:18, RB:30, WR:36, TE:12}
    const posRank = PB.posRankMap(state.myQueue);
    const out = { QB: 0, RB: 0, WR: 0, TE: 0 };
    available.forEach(p => {
      if (out[p.pos] !== undefined && posRank[p.normName] <= (th[p.pos] || 999)) out[p.pos]++;
    });
    return out;
  };

  // Rule 3 status: QB2 with a Week 7 bye is rostered and QB3 is not yet.
  PB.rule3Status = function (state) {
    const roster = NS.board.myRoster(state);
    const myQBs = roster.filter(p => p.pos === 'QB');
    const byeOf = p => {
      const q = state.myQueue.find(x => x.normName === p.normName);
      if (q && q.bye != null) return q.bye;
      const k = (state.settings.keepers || []).find(k => NS.normName(k.player) === p.normName);
      if (k && k.nfl) return state.settings.byes[k.nfl];
      return null;
    };
    const week7QBs = myQBs.filter(q => byeOf(q) === 7);
    const collision = myQBs.length >= 2 && week7QBs.length >= 2;
    return {
      qbCount: myQBs.length,
      collision,
      forced: collision && myQBs.length < 3,
      collidingQB: collision ? week7QBs.map(q => q.player).filter(n => NS.normName(n) !== 'josh allen')[0] : null
    };
  };

  // Rule 2 helpers -----------------------------------------------------------
  PB.poolQBsAvailable = function (state, available) {
    const pool = new Set((state.settings.qb2Pool || []).map(NS.normName));
    return available.filter(p => p.pos === 'QB' && pool.has(p.normName));
  };

  // Fallen elite: tier 1-2 skill player, a full tier above the remaining pool
  // QBs, with 3+ startable QBs still on the board.
  PB.fallenElite = function (state, available) {
    const poolQBs = PB.poolQBsAvailable(state, available);
    const startable = PB.startableRemaining(state, available);
    const bestPoolTier = poolQBs.length ? Math.min(...poolQBs.map(q => q.tier)) : Infinity;
    const candidate = available.find(p =>
      NS.SKILL.includes(p.pos) && p.tier <= 2 && p.tier < bestPoolTier);
    const condTier = !!candidate;
    const condQBs = startable.QB >= 3;
    return {
      fires: condTier && condQBs && poolQBs.length > 0,
      candidate: candidate || null,
      condTier, condQBs,
      poolQBs, startableQBs: startable.QB
    };
  };

  // Rule 8 lean state at one of my picks: once a side (WR/RB) hits 0 after
  // pick 34, the lean covers my next TWO skill picks - even after the count
  // leaves zero. QB picks don't consume the window. If the side is still
  // empty when the window closes, the trigger re-arms.
  // -> {pos:'WR'|'RB', remaining:1|2} | null
  PB.computeLean = function (state, pick) {
    const live = NS.pickorder.myPicks(state.settings).live;
    const qb2Pick = live[2];
    if (!(pick > qb2Pick)) return null;
    const roster = NS.board.myRoster(state);
    let lean = null;
    for (const q of live.filter(q => q > qb2Pick && q <= pick)) {
      if (!lean) {
        const counts = NS.board.posCounts(roster.filter(r => r.pick < q));
        if (counts.WR === 0) lean = { pos: 'WR', remaining: 2 };
        else if (counts.RB === 0) lean = { pos: 'RB', remaining: 2 };
      }
      if (q === pick) return lean;
      const made = roster.find(r => r.pick === q);
      if (made && NS.SKILL.includes(made.pos) && lean) {
        lean.remaining--;
        if (lean.remaining <= 0) lean = null;
      }
    }
    return lean;
  };

  // Legality of one player at one pick. -> {legal:true} | {legal:false, ruleId, reason}
  // ctx: {pick, counts, top6TEKeys, kdst:[p1,p2], rule3}
  PB.legality = function (state, ctx, player) {
    const s = state.settings;
    const pick = ctx.pick;
    const counts = ctx.counts;

    // R6 - K/DST timing
    if (player.pos === 'K' || player.pos === 'DST') {
      if (!ctx.kdst.includes(pick)) {
        return { legal: false, ruleId: 'R6', reason: `K/DST only at picks ${ctx.kdst.join(' and ')}` };
      }
      if (counts[player.pos] >= 1) {
        return { legal: false, ruleId: 'R6', reason: `never a second ${player.pos}` };
      }
    }

    // R7 - IR stash timing
    const irLate = (s.irLate || []).map(NS.normName);
    const irEnd = (s.irSeasonEnd || []).map(NS.normName);
    const lastPick = ctx.kdst[ctx.kdst.length - 1];
    if (irEnd.includes(player.normName) && pick < lastPick) {
      return { legal: false, ruleId: 'R7', reason: `season-ending stash - pick ${lastPick} only` };
    }
    if (irLate.includes(player.normName) && pick < s.irStashPick) {
      return { legal: false, ruleId: 'R7', reason: `IR stash - pick ${s.irStashPick}+ only` };
    }

    // R1 - picks 7 and 14 skill only (Lamar exception at 14)
    if (ctx.earlyPicks.includes(pick) && !NS.SKILL.includes(player.pos)) {
      const isLamar = player.normName === LAMAR;
      if (!(pick === ctx.earlyPicks[1] && isLamar)) {
        return { legal: false, ruleId: 'R1', reason: `pick ${pick} = RB/WR/TE only` };
      }
    }

    // R4 - QB count caps
    if (player.pos === 'QB') {
      if (counts.QB >= 4) return { legal: false, ruleId: 'R4', reason: 'never a 5th QB' };
      if (counts.QB >= 3 && pick < s.cheapQBPick) {
        return { legal: false, ruleId: 'R4', reason: `4th QB only at pick ${s.cheapQBPick}+` };
      }
    }

    // R4/R5 - TE2 gate
    if (player.pos === 'TE' && counts.TE >= 1) {
      if (counts.TE >= 2) return { legal: false, ruleId: 'R4', reason: 'never a 3rd TE' };
      const rosterTE = ctx.myTEKeys[0];
      const bothTop6 = ctx.top6TEKeys.has(player.normName) &&
        (rosterTE === undefined || ctx.top6TEKeys.has(rosterTE));
      if (!bothTop6) {
        const rid = ctx.top6TEKeys.has(player.normName) ? 'R4' : 'R5';
        return { legal: false, ruleId: rid, reason: 'TE2 only if both TEs are top-6 in my queue' };
      }
    }

    return { legal: true };
  };

  // Build the legality context once per pick.
  PB.buildCtx = function (state, pick) {
    const s = state.settings;
    const roster = NS.board.myRoster(state);
    const counts = NS.board.posCounts(roster);
    const queueTEs = state.myQueue.filter(p => p.pos === 'TE').sort((a, b) => a.rank - b.rank);
    const top6TEKeys = new Set(queueTEs.slice(0, 6).map(t => t.normName));
    const myTEKeys = roster.filter(p => p.pos === 'TE').map(p => p.normName);
    const live = NS.pickorder.myPicks(s).live;
    return {
      pick, counts, top6TEKeys, myTEKeys,
      kdst: PB.kdstPicks(s),
      earlyPicks: live.slice(0, 2),         // 7 and 14 with default settings
      qb2Pick: live[2],                     // 34
      rule3Picks: [live[5], live[6]],       // 67 and 74
      rule3: PB.rule3Status(state),
      lean: PB.computeLean(state, pick)
    };
  };

  if (typeof module !== 'undefined' && module.exports) module.exports = NS;
})();

// Survival estimates: cheap heuristic by default, Monte Carlo when the A1
// flag is on. Both answer "will this player still be there at my next pick?"
(function () {
  const NS = globalThis.DraftOS;
  const SV = NS.survival = {};

  SV.adpRank = function (state, player) {
    const row = (state.adp || []).find(a => a.normName === player.normName);
    return row ? row.rank : null;
  };

  // Heuristic (the live-clock default):
  //   ref = ADP rank if pasted, else my queue rank
  //   margin = ref - currentPick
  //   margin >= picksBetween * likelyFactor  -> likely
  //   margin >= picksBetween * coinFactor    -> coin-flip
  //   else                                   -> gone
  SV.heuristic = function (state, player, currentPick, picksBetween) {
    const f = state.settings.survivalFactors || { likely: 1.0, coinflip: 0.5 };
    const ref = SV.adpRank(state, player) ?? player.rank;
    const margin = ref - currentPick;
    if (margin >= picksBetween * f.likely) return 'likely';
    if (margin >= picksBetween * f.coinflip) return 'coin-flip';
    return 'gone';
  };

  SV.formulaText = function (state) {
    const f = state.settings.survivalFactors || { likely: 1.0, coinflip: 0.5 };
    return `margin = (ADP rank if pasted, else queue rank) - current pick. ` +
      `likely if margin >= picks-between x ${f.likely}; coin-flip if >= picks-between x ${f.coinflip}; else gone.`;
  };

  // Monte Carlo (A1): N fast sims from the current board to my next pick.
  // Cached by board signature; caps out early if it would blow the 1s budget.
  let mcCache = { sig: null, result: null };

  SV.boardSignature = function (state) {
    return state.picks.map(p => p.pick).join(',') + '|' + (state.adp || []).length +
      '|' + state.myQueue.length;
  };

  SV.monteCarlo = function (state, opts) {
    opts = opts || {};
    const sig = SV.boardSignature(state) + '|' + JSON.stringify(opts.protect || []);
    if (!opts.force && mcCache.sig === sig && mcCache.result) return mcCache.result;

    const N = opts.n || 200;
    const budgetMs = opts.budgetMs || 900;
    const cur = NS.board.currentPick(state);
    const target = opts.targetPick ||
      NS.pickorder.myNextLivePick(state.settings, NS.board.isMyPick(state, cur) ? cur + 1 : cur);
    if (!target) return { probs: {}, n: 0, targetPick: null, capped: false };

    const top = NS.board.available(state).slice(0, 15);
    const counts = {};
    top.forEach(p => { counts[p.normName] = 0; });

    const t0 = Date.now();
    let ran = 0, capped = false;
    const seedBase = opts.seed !== undefined ? opts.seed : 1234567;
    for (let i = 0; i < N; i++) {
      if (Date.now() - t0 > budgetMs) { capped = true; break; }
      const rng = NS.makeRng(seedBase + i * 7919);
      const survivors = NS.sim.simulateToTarget(state, target, rng, { protect: opts.protect });
      top.forEach(p => { if (survivors.has(p.normName)) counts[p.normName]++; });
      ran++;
    }
    const probs = {};
    top.forEach(p => { probs[p.normName] = ran ? Math.round(100 * counts[p.normName] / ran) : 0; });
    const result = { probs, n: ran, targetPick: target, capped, ms: Date.now() - t0 };
    mcCache = { sig, result };
    return result;
  };

  SV.clearCache = function () { mcCache = { sig: null, result: null }; };

  if (typeof module !== 'undefined' && module.exports) module.exports = NS;
})();

/* ===== js/recommend.js ===== */
// recommend(state) -> Rec. Pure function of state; no DOM, no network.
// My queue order is the only value signal. Playbook rules filter and override.
(function () {
  const NS = globalThis.DraftOS;
  const PB = NS.playbook;

  const why = (txt, rules) => ({ text: txt, rules: rules || [] });

  function propsFor(state, player) {
    return (state.props || []).filter(pr => pr.normName === player.normName);
  }

  function injuryTag(state, player) {
    const hit = (state.injuries || []).find(i => NS.normName(i.name) === player.normName);
    return hit ? hit.tag : null;
  }

  function decorate(state, player) {
    if (!player) return null;
    return {
      ...player,
      injury: injuryTag(state, player),
      props: propsFor(state, player),
      allenStack: player.team === 'BUF' && ['WR', 'TE', 'RB'].includes(player.pos)
    };
  }

  // Pick the primary/alt among legal players for this pick.
  function choosePrimary(state, ctx, legal, available) {
    const s = state.settings;
    const pick = ctx.pick;
    const rulesFired = [];
    let primary = legal[0] || null;
    let note = primary ? `#${primary.rank} in your queue - best legal player` : 'no legal players left';

    // R6 - K/DST picks: recommend whichever of K/DST is missing (higher-queued first)
    if (ctx.kdst.includes(pick)) {
      const wantK = ctx.counts.K === 0, wantD = ctx.counts.DST === 0;
      const cands = legal.filter(p =>
        (p.pos === 'K' && wantK) || (p.pos === 'DST' && wantD));
      if (cands.length) {
        primary = cands[0]; // legal is queue-ordered; higher in queue wins
        rulesFired.push('R6');
        note = `K/DST window (pick ${pick}) - ${primary.pos} is the ${wantK && wantD ? 'higher-queued need' : 'remaining need'}`;
        return { primary, note, rulesFired, override: true };
      }
    }

    // R1 - Lamar exception at pick 14
    if (pick === ctx.earlyPicks[1]) {
      const lamar = legal.find(p => p.normName === 'lamar jackson');
      if (lamar) {
        rulesFired.push('R1');
        return { primary: lamar, note: `R1 exception: Lamar Jackson available at pick ${pick}`, rulesFired, override: true };
      }
    }

    // R3 - forced QB at 67/74 while the Week 7 collision is unresolved
    if (ctx.rule3.forced && ctx.rule3Picks.includes(pick)) {
      const qb = legal.find(p => p.pos === 'QB');
      if (qb) {
        rulesFired.push('R3');
        return {
          primary: qb, rulesFired, override: true,
          note: `R3: QB2 (${ctx.rule3.collidingQB || 'bye-7 QB'}) collides with Allen's Week 7 bye - QB3 forced by pick ${ctx.rule3Picks[1]}`
        };
      }
    }

    // R2 - pick 34 QB2 logic (only while I still need a QB2)
    if (pick === ctx.qb2Pick && ctx.counts.QB < 2) {
      const fe = PB.fallenElite(state, available);
      if (fe.fires) {
        rulesFired.push('R2', 'R9');
        return {
          primary: fe.candidate, rulesFired, override: true, fallenElite: fe,
          note: `R2 exception: ${fe.candidate.name} (tier ${fe.candidate.tier}) is a full tier above the remaining pool QBs and ${fe.startableQBs} startable QBs remain`
        };
      }
      if (fe.poolQBs.length) {
        rulesFired.push('R2');
        return {
          primary: fe.poolQBs[0], rulesFired, override: true, fallenElite: fe,
          note: `R2: pick ${pick} = QB2 - ${fe.poolQBs[0].name} is the highest-queued pool QB` +
            (fe.condTier && !fe.condQBs ? ` (fallen elite blocked: only ${fe.startableQBs} startable QBs left)` : '')
        };
      }
      const anyQB = legal.find(p => p.pos === 'QB');
      if (anyQB) {
        rulesFired.push('R2');
        return { primary: anyQB, rulesFired, override: true, note: `R2: pick ${pick} = QB2 - no pool QB left, best queue QB instead` };
      }
    }

    // R8 - lean the empty side for the two skill picks after the trigger
    // (window computed in playbook.computeLean; R9 tier value can override)
    if (primary && ctx.lean) {
      const leanPos = ctx.lean.pos;
      if (primary.pos !== leanPos) {
        const bestLean = legal.find(p => p.pos === leanPos);
        if (bestLean) {
          if (primary.tier < bestLean.tier) {
            rulesFired.push('R9');
            note = `R9: ${primary.name} is a full tier above the best ${leanPos} (${bestLean.name}) despite 0 ${leanPos} rostered`;
          } else if (bestLean.rank - primary.rank >= 10) {
            rulesFired.push('R8');
            note = `R8 exception: ${primary.name} is ${bestLean.rank - primary.rank} ranks better than the best ${leanPos}`;
          } else {
            primary = bestLean;
            rulesFired.push('R8');
            note = `R8: leaning ${leanPos} (${bestLean.name}, #${bestLean.rank}) - ` +
              `${ctx.lean.remaining} lean pick${ctx.lean.remaining > 1 ? 's' : ''} left in the window`;
          }
        }
      }
    }

    // R2 bookkeeping: at pick 34 with QB2 already rostered, cite R2 as satisfied
    if (pick === ctx.qb2Pick && ctx.counts.QB >= 2 && primary) {
      rulesFired.push('R2');
      note += ' (R2 satisfied - QB2 already rostered)';
    }

    // A5 Avoid marker: push below any equal-tier alternative (never removed)
    if (primary && primary.marker === 'avoid') {
      const alt = legal.find(p => p !== primary && p.tier <= primary.tier && p.marker !== 'avoid');
      if (alt) {
        primary = alt;
        note = `${alt.name} over avoided ${legal[0].name} (equal tier)`;
      }
    }

    return { primary, note, rulesFired, override: false };
  }

  // Main entry. opts.forPick lets the precompute path aim at a future pick.
  NS.recommend = function (state, opts) {
    opts = opts || {};
    const s = state.settings;
    const cur = NS.board.currentPick(state);
    if (cur === null) return { draftOver: true };
    const pick = opts.forPick || cur;
    const myPick = NS.board.isMyPick(state, pick);
    const nextMine = NS.pickorder.myNextLivePick(s, myPick ? pick + 1 : pick);
    const available = NS.board.available(state);
    const ctx = PB.buildCtx(state, pick);

    // Legality pass
    const legal = [], blocked = [];
    for (const p of available) {
      const v = PB.legality(state, ctx, p);
      if (v.legal) legal.push(p);
      else blocked.push({ player: p, ruleId: v.ruleId, reason: v.reason });
    }

    // Shared panels (used on and off the clock)
    const startable = PB.startableRemaining(state, available);
    const picksBetween = nextMine
      ? NS.pickorder.livePicksBetween(s, myPick ? pick : cur - 1, nextMine)
      : 0;

    const mc = (s.flags.monteCarlo && NS.sim)
      ? NS.survival.monteCarlo(state, { protect: (state.sim && state.sim.protect) || [] })
      : null;

    const survLabel = p => {
      if (mc && mc.probs[p.normName] !== undefined) {
        const pct = mc.probs[p.normName];
        return { label: pct >= 75 ? 'likely' : pct >= 35 ? 'coin-flip' : 'gone', prob: pct };
      }
      return { label: NS.survival.heuristic(state, p, pick, picksBetween), prob: null };
    };

    const survival = available.slice(0, 5).map(p => ({ player: decorate(state, p), ...survLabel(p) }));

    // Scarcity cliff: gap between best and 5th-best available per position
    const scarcity = [];
    for (const pos of ['QB', 'RB', 'WR', 'TE']) {
      const posAvail = available.filter(p => p.pos === pos);
      if (posAvail.length >= 5) {
        const gap = posAvail[4].rank - posAvail[0].rank;
        scarcity.push({ pos, gap, cliff: gap > s.scarcityGap });
      } else if (posAvail.length > 0) {
        scarcity.push({ pos, gap: null, cliff: true, thin: posAvail.length });
      }
    }

    const notes = NS.board.runDetection(state);
    const qbComp = NS.board.qb2Competition(state);
    if (qbComp !== null && ctx.counts.QB < 2) notes.push(`${qbComp} teams could take a QB before pick ${ctx.qb2Pick}`);

    const rule3 = ctx.rule3;
    const week7Alert = rule3.collision
      ? `WEEK 7 COLLISION: ${rule3.collidingQB || 'a rostered QB'} shares Allen's Week 7 bye.` +
        (rule3.forced ? ` QB3 is forced at picks ${ctx.rule3Picks.join('/')}.` : ' QB3 rostered - resolved.')
      : null;

    const base = {
      pick, round: NS.pickorder.slotForPick(pick, s.teams.length).round,
      team: NS.board.teamForPick(state, pick),
      myPick, nextMyPick: nextMine, picksUntilMine: picksBetween,
      startable, scarcity, survival, notes, week7Alert,
      monteCarlo: mc ? { n: mc.n, targetPick: mc.targetPick, capped: mc.capped } : null,
      ghost: !!state.ghost
    };

    if (!myPick) {
      // Watch list: my top 5 legal targets for my next pick, with risk
      const watch = legal.slice(0, 5).map(p => ({ player: decorate(state, p), ...survLabel(p) }));
      return { ...base, watch };
    }

    // On the clock ------------------------------------------------------------
    const chosen = choosePrimary(state, ctx, legal, available);
    const primary = chosen.primary;
    const altPool = legal.filter(p => p !== primary);
    const alt = altPool[0] || null;

    // Panic: highest-ranked legal player very likely still there if I hesitate
    const panicTh = s.panicProb || 80;
    const panic = legal.find(p => {
      const sl = survLabel(p);
      return sl.prob !== null ? sl.prob >= panicTh : sl.label === 'likely';
    }) || null;

    // Do-not-take list for this pick (top blocked players by queue rank)
    const doNotTake = blocked.slice(0, 6).map(b => ({
      player: decorate(state, b.player), ruleId: b.ruleId, reason: b.reason
    }));

    // Cost of waiting per position of interest
    const costOfWaiting = [];
    for (const pos of ['QB', 'RB', 'WR', 'TE']) {
      const now = available.find(p => p.pos === pos);
      if (!now) continue;
      const later = available.find(p => p.pos === pos && survLabel(p).label === 'likely');
      costOfWaiting.push({
        pos,
        text: later
          ? `pass on ${pos} now -> expected best ${pos} at pick ${nextMine || '-'} is ${later.name} (#${later.rank})`
          : `pass on ${pos} now -> no ${pos} is safe to your next pick`
      });
    }

    // Reach-or-wait line (A1)
    let reachOrWait = null;
    if (mc && primary && alt) {
      const pP = mc.probs[primary.normName], pA = mc.probs[alt.normName];
      if (pP !== undefined || pA !== undefined) {
        reachOrWait = `Taking ${primary.name} now vs waiting: ${primary.name} survives ${pP ?? '?'}% / ${alt.name} survives ${pA ?? '?'}%`;
      }
    }

    // "Yahoo queue should be": primary, alt, panic, then one more legal name -
    // typed straight into Yahoo's in-draft queue as insurance.
    const yahooQueue = [];
    [primary, alt, panic].forEach(p => {
      if (p && !yahooQueue.includes(p.name)) yahooQueue.push(p.name);
    });
    for (const p of legal) {
      if (yahooQueue.length >= 4) break;
      if (!yahooQueue.includes(p.name)) yahooQueue.push(p.name);
    }

    const allRules = chosen.rulesFired.slice();
    return {
      ...base,
      primary: primary ? { player: decorate(state, primary), why: why(chosen.note, allRules) } : null,
      alt: alt ? { player: decorate(state, alt), why: why(`next best legal (#${alt.rank})`, []) } : null,
      panic: panic ? { player: decorate(state, panic), why: why('highest-ranked legal player very likely still there if you hesitate', []) } : null,
      doNotTake, costOfWaiting, reachOrWait, yahooQueue,
      rulesFired: allRules
    };
  };

  // Long-press "conflicts with playbook?" for any player at the current pick.
  NS.conflictCheck = function (state, player) {
    const pick = NS.board.currentPick(state);
    if (pick === null) return { legal: true, note: 'draft over' };
    const ctx = PB.buildCtx(state, pick);
    const v = PB.legality(state, ctx, player);
    if (v.legal) return { legal: true, note: `No conflict at pick ${pick}.` };
    const rule = PB.ruleById(v.ruleId);
    return { legal: false, ruleId: v.ruleId, note: `${v.ruleId} (${rule ? rule.label : ''}): ${v.reason}` };
  };

  // One-sentence Next Plan after each of my picks.
  NS.nextPlan = function (state) {
    const s = state.settings;
    const next = NS.pickorder.myNextLivePick(s, NS.board.currentPick(state) || 999);
    if (!next) return 'Draft complete.';
    const rec = NS.recommend(state, { forPick: next });
    if (!rec || !rec.primary) return `Pick ${next}: best legal player in queue.`;
    const parts = [rec.primary.player.name];
    if (rec.alt) parts.push(`else ${rec.alt.player.name}`);
    if (rec.panic && rec.panic.player.name !== (rec.alt && rec.alt.player.name)) {
      parts.push(`else ${rec.panic.player.name}`);
    }
    const counts = NS.board.posCounts(NS.board.myRoster(state));
    const needs = [];
    if (counts.QB < 2) needs.push('QB2 still open');
    else if (counts.QB < 3) needs.push('QB3 still open');
    if (counts.TE < 1) needs.push('TE empty');
    if (counts.RB === 0) needs.push('RB empty');
    if (counts.WR === 0) needs.push('WR empty');
    return `Pick ${next}: ${parts.join(', ')}${needs.length ? ` (${needs.join('; ')})` : ''}.`;
  };

  // Safe mode wrapper (A6): the engine must never blank the app mid-draft.
  NS.safeRecommend = function (state, opts) {
    try {
      return NS.recommend(state, opts);
    } catch (e) {
      return { engineError: String(e && e.stack || e) };
    }
  };

  if (typeof module !== 'undefined' && module.exports) module.exports = NS;
})();

/* ===== js/buildpath.js ===== */
// A3 Build-path guard: can the target build still fit in my remaining picks?
(function () {
  const NS = globalThis.DraftOS;
  const BP = NS.buildpath = {};

  const RELAX = [
    { key: 'QB', floor: 3, label: '4th QB' },
    { key: 'TE', floor: 1, label: '2nd TE' },
    { key: 'WR', floor: 5, label: '6th WR' },
    { key: 'RB', floor: 4, label: '5th RB' }
  ];

  BP.needed = function (targets, counts) {
    let n = 0;
    for (const pos of Object.keys(targets)) n += Math.max(0, targets[pos] - (counts[pos] || 0));
    return n;
  };

  // -> {counts, picksLeft, targets, needed, reachable, dropped[], remainingText, message}
  BP.guard = function (state) {
    const counts = NS.board.posCounts(NS.board.myRoster(state));
    const cur = NS.board.currentPick(state) || (NS.board.totalPicks(state) + 1);
    const picksLeft = NS.pickorder.myPicks(state.settings).live.filter(p => p >= cur).length;
    const targets = { ...(state.settings.targets || { QB: 3, RB: 5, WR: 6, TE: 1, K: 1, DST: 1 }) };

    const dropped = [];
    let needed = BP.needed(targets, counts);
    while (needed > picksLeft) {
      const relax = RELAX.find(r => targets[r.key] > r.floor);
      if (!relax) break;
      targets[relax.key] -= 1;
      dropped.push(relax.label);
      needed = BP.needed(targets, counts);
    }
    const reachable = needed <= picksLeft;

    const parts = [];
    for (const pos of ['QB', 'RB', 'WR', 'TE', 'K', 'DST']) {
      const rem = Math.max(0, targets[pos] - (counts[pos] || 0));
      if (rem > 0) parts.push(rem > 1 ? `${rem} ${pos}` : pos);
    }
    return {
      counts, picksLeft, targets, needed, reachable, dropped,
      remainingText: `Remaining: ${parts.join(', ') || 'build complete'} in ${picksLeft} picks`,
      message: dropped.length
        ? `Build unreachable - drop ${dropped.join(', then ')}`
        : (reachable ? null : 'Build unreachable even after relaxing all optional targets')
    };
  };

  if (typeof module !== 'undefined' && module.exports) module.exports = NS;
})();

/* ===== js/simulator.js ===== */
// Mock-draft simulator + fast sims for Monte Carlo. Opponents draft off ADP
// (else my queue) through the opponent-need model with mild randomness.
(function () {
  const NS = globalThis.DraftOS;
  const SIM = NS.sim = {};

  const refRank = (state, p) => NS.survival.adpRank(state, p) ?? p.rank;

  // One opponent pick. availList is queue-ordered; returns chosen player or null.
  SIM.opponentChoose = function (state, availList, picksSoFar, pickNo, team, rng, opts) {
    opts = opts || {};
    const protect = new Set((opts.protect || []).map(NS.normName));
    const { round } = NS.pickorder.slotForPick(pickNo, state.settings.teams.length);

    const counts = { QB: 0, RB: 0, WR: 0, TE: 0, K: 0, DST: 0 };
    picksSoFar.forEach(p => { if (p.team === team && counts[p.pos] !== undefined) counts[p.pos]++; });
    const w = NS.board.needWeights(counts, round, state.settings);

    // Handcuffs go late: not before pick 100 unless the starter just went.
    const recent = picksSoFar.filter(p => p.pick >= pickNo - 2 && p.pick < pickNo);
    const handcuffOk = p => {
      if (!p.handcuffOf) return true;
      if (pickNo >= 100) return true;
      const starterKey = NS.normName(p.handcuffOf);
      return recent.some(r => r.normName === starterKey);
    };

    const pool = availList
      .filter(p => !protect.has(p.normName))
      .filter(p => (w[p.pos] || 0) > 0 || !['K', 'DST'].includes(p.pos))
      .filter(handcuffOk)
      .sort((a, b) => refRank(state, a) - refRank(state, b))
      .slice(0, 12);
    if (!pool.length) return availList.find(p => !protect.has(p.normName)) || availList[0] || null;

    let total = 0;
    const weights = pool.map((p, i) => {
      const s = Math.exp(-i / 1.3) * (0.2 + (w[p.pos] || 0));
      total += s;
      return s;
    });
    let r = rng() * total;
    for (let i = 0; i < pool.length; i++) {
      r -= weights[i];
      if (r <= 0) return pool[i];
    }
    return pool[0];
  };

  // Fast sim used by Monte Carlo: from the current board to targetPick
  // (exclusive), opponents only. My unfilled picks in the window are skipped
  // (nobody is removed) - see ASSUMPTIONS.md. Returns surviving normName Set.
  SIM.simulateToTarget = function (state, targetPick, rng, opts) {
    const total = NS.board.totalPicks(state);
    const filled = new Set(state.picks.map(p => p.pick));
    const picksSoFar = state.picks.slice();
    let avail = NS.board.available(state).slice();
    const me = NS.board.myTeamName(state.settings);
    for (let pick = 1; pick < Math.min(targetPick, total + 1); pick++) {
      if (filled.has(pick)) continue;
      const team = NS.board.teamForPick(state, pick);
      if (team === me) continue;
      const chosen = SIM.opponentChoose(state, avail, picksSoFar, pick, team, rng, opts);
      if (chosen) {
        avail = avail.filter(p => p !== chosen);
        picksSoFar.push({ pick, team, player: chosen.name, pos: chosen.pos, normName: chosen.normName });
      }
    }
    return new Set(avail.map(p => p.normName));
  };

  // ---- Simulate tab (separate from live state) ------------------------------

  SIM.freshSim = function (state, opts) {
    return {
      picks: NS.board.keeperPickEntries(state.settings),
      log: [],
      protect: (opts && opts.protect) || (state.sim && state.sim.protect) || [],
      seed: (opts && opts.seed) || Math.floor(1e9 * ((opts && opts.rand) || 0.42)) + 7,
      step: 0
    };
  };

  // A live-shaped view of the sim board so recommend()/board fns work on it.
  SIM.shadow = function (state, sim) {
    return Object.assign({}, state, { picks: sim.picks, ghost: false });
  };

  // Advance the sim until it's my pick (or the draft ends). Mutates sim.
  SIM.autoToMyPick = function (state, sim) {
    const shadow = SIM.shadow(state, sim);
    const me = NS.board.myTeamName(state.settings);
    let guard = 0;
    while (guard++ < 400) {
      const cur = NS.board.currentPick(shadow);
      if (cur === null) return { done: true };
      const team = NS.board.teamForPick(shadow, cur);
      if (team === me) return { done: false, pick: cur };
      const rng = NS.makeRng(sim.seed + sim.step * 104729);
      sim.step++;
      const avail = NS.board.available(shadow);
      const chosen = SIM.opponentChoose(shadow, avail, sim.picks, cur, team, rng, { protect: sim.protect });
      if (!chosen) return { done: true };
      sim.picks.push({ pick: cur, team, player: chosen.name, pos: chosen.pos, normName: chosen.normName, keeper: false, byMe: false });
      sim.log.push(`Pick ${cur} - ${team}: ${chosen.name} (${chosen.pos})`);
    }
    return { done: true };
  };

  SIM.simMyPick = function (state, sim, player) {
    const shadow = SIM.shadow(state, sim);
    const cur = NS.board.currentPick(shadow);
    const me = NS.board.myTeamName(state.settings);
    sim.picks.push({ pick: cur, team: me, player: player.name, pos: player.pos, normName: player.normName, keeper: false, byMe: true });
    sim.log.push(`Pick ${cur} - ${me} (you): ${player.name} (${player.pos})`);
  };

  // ---- Roadmap (A2): full mocks with the engine picking for me --------------

  SIM.fullMock = function (state, seed, opts) {
    const sim = SIM.freshSim(state, { seed, protect: (opts && opts.protect) || [] });
    const me = NS.board.myTeamName(state.settings);
    const myPicksLog = [];
    let guard = 0;
    while (guard++ < 400) {
      const res = SIM.autoToMyPick(state, sim);
      if (res.done) break;
      const shadow = SIM.shadow(state, sim);
      const rec = NS.safeRecommend(shadow);
      const avail = NS.board.available(shadow);
      const choice = (rec && rec.primary && rec.primary.player)
        ? avail.find(p => p.normName === rec.primary.player.normName) || avail[0]
        : avail[0];
      if (!choice) break;
      SIM.simMyPick(state, sim, choice);
      const counts = NS.board.posCounts(NS.board.myRoster(SIM.shadow(state, sim)));
      myPicksLog.push({ pick: res.pick, player: choice.name, pos: choice.pos, counts: { ...counts } });
    }
    return { sim, myPicksLog };
  };

  SIM.roadmap = function (state, runs) {
    runs = runs || 100;
    const perPick = {}; // pick -> {counts: {name: n}, posTotals: {...sum}, runs}
    for (let i = 0; i < runs; i++) {
      const { myPicksLog } = SIM.fullMock(state, 1000 + i * 613, { protect: (state.sim && state.sim.protect) || [] });
      for (const row of myPicksLog) {
        const slot = perPick[row.pick] || (perPick[row.pick] = { names: {}, posSums: { QB: 0, RB: 0, WR: 0, TE: 0, K: 0, DST: 0 }, runs: 0 });
        slot.names[row.player] = (slot.names[row.player] || 0) + 1;
        for (const pos of Object.keys(slot.posSums)) slot.posSums[pos] += row.counts[pos] || 0;
        slot.runs++;
      }
    }
    return Object.keys(perPick).map(Number).sort((a, b) => a - b).map(pick => {
      const slot = perPick[pick];
      const top = Object.entries(slot.names).sort((a, b) => b[1] - a[1]);
      const counts = {};
      for (const pos of Object.keys(slot.posSums)) counts[pos] = Math.round(slot.posSums[pos] / slot.runs);
      return {
        pick,
        primary: top[0] ? top[0][0] : '-',
        top3: top.slice(0, 3).map(([name, n]) => ({ name, pct: Math.round(100 * n / slot.runs) })),
        counts
      };
    });
  };

  if (typeof module !== 'undefined' && module.exports) module.exports = NS;
})();

// State schema, defaults, migration, undo, persistence. Storage is injected
// (localStorage in the browser, a plain object in tests).
(function () {
  const NS = globalThis.DraftOS;
  const ST = NS.store = {};

  ST.VERSION = 2;
  ST.KEY = 'draftos_state_v2';
  ST.AUTOSAVE_KEY = 'draftos_autosave';
  ST.UNDO_LIMIT = 30;

  ST.defaultSettings = function () {
    return {
      teams: NS.clone(NS.DATA.TEAMS),
      mySlot: NS.DATA.MY_SLOT,
      rounds: NS.DATA.ROUNDS,
      keepers: NS.clone(NS.DATA.KEEPERS),
      byes: NS.clone(NS.DATA.BYES),
      clockSeconds: 90,
      tierSize: 12,
      qb2Pool: NS.clone(NS.DATA.QB2_POOL),
      irLate: NS.clone(NS.DATA.IR_LATE),
      irSeasonEnd: NS.clone(NS.DATA.IR_SEASON_END),
      irStashPick: 147,
      cheapQBPick: 134,
      startable: { QB: 18, RB: 30, WR: 36, TE: 12 },
      targets: { QB: 3, RB: 5, WR: 6, TE: 1, K: 1, DST: 1 },
      scarcityGap: 15,
      survivalFactors: { likely: 1.0, coinflip: 0.5 },
      panicProb: 80,
      simQB: { firstQBIn4: 0.7, secondQBByR8: 0.5 },
      // Addendum A features - all default OFF (Confirmed Defaults)
      flags: {
        monteCarlo: false,     // A1
        roadmap: false,        // A2
        buildGuard: false,     // A3
        byeLoad: false,        // A4
        markers: false,        // A5
        resilience: false      // A6 extras (confirm dialog, precompute)
      }
    };
  };

  ST.buildSampleQueue = function (settings) {
    const parsed = NS.parser.parseQueue(NS.DATA.SAMPLE_QUEUE_TEXT, {
      byes: settings.byes, keepers: settings.keepers, tierSize: settings.tierSize
    });
    const fillers = NS.DATA.buildFillers().map(f => ({
      ...f, normName: NS.normName(f.name), marker: null, handcuffOf: null
    }));
    return parsed.players.concat(fillers);
  };

  ST.defaultState = function () {
    const settings = ST.defaultSettings();
    return {
      version: ST.VERSION,
      settings,
      myQueue: ST.buildSampleQueue(settings),
      usingSample: true,
      adp: [],
      props: [],
      propsText: '',
      fp: [],
      fpText: '',
      injuries: NS.clone(NS.DATA.INJURY_TAGS),
      picks: NS.board.keeperPickEntries(settings),
      log: [{ t: 'init', msg: 'Draft OS initialized. Keepers pre-filled.' }],
      ghost: false,
      undoStack: [],
      sim: null,
      grade: null
    };
  };

  // ---- Migration ------------------------------------------------------------
  // v1 = any blob without version (or version 1). We keep every field the user
  // had and fill in whatever v2 added. Never silently wipe.
  ST.migrate = function (raw) {
    if (!raw || typeof raw !== 'object') throw new Error('not an object');
    const v = raw.version || 1;
    if (v > ST.VERSION) throw new Error(`state version ${v} is newer than app (${ST.VERSION})`);
    const base = ST.defaultState();
    const out = { ...base, ...raw };
    out.settings = { ...base.settings, ...(raw.settings || {}) };
    out.settings.flags = { ...base.settings.flags, ...((raw.settings || {}).flags || {}) };
    out.settings.startable = { ...base.settings.startable, ...((raw.settings || {}).startable || {}) };
    out.settings.targets = { ...base.settings.targets, ...((raw.settings || {}).targets || {}) };
    out.version = ST.VERSION;
    ST.validate(out);
    return out;
  };

  ST.validate = function (state) {
    if (!state || typeof state !== 'object') throw new Error('state is not an object');
    if (!Array.isArray(state.settings && state.settings.teams) || !state.settings.teams.length) {
      throw new Error('settings.teams missing');
    }
    if (!Array.isArray(state.myQueue)) throw new Error('myQueue missing');
    if (!Array.isArray(state.picks)) throw new Error('picks missing');
    return true;
  };

  // ---- Persistence ----------------------------------------------------------
  ST.save = function (state, storage) {
    const json = JSON.stringify(ST.exportable(state));
    try {
      const prev = storage.getItem(ST.KEY);
      if (prev) storage.setItem(ST.AUTOSAVE_KEY, prev);
      storage.setItem(ST.KEY, json);
    } catch (e) { /* iOS quota - export button is the escape hatch */ }
    return json;
  };

  // -> {state} | {corrupt:true, error, autosave: state|null, fresh: state}
  ST.load = function (storage) {
    const tryParse = key => {
      const raw = storage.getItem(key);
      if (!raw) return null;
      return ST.migrate(JSON.parse(raw));
    };
    try {
      const state = tryParse(ST.KEY);
      if (state) return { state };
      return { state: ST.defaultState(), fresh: true };
    } catch (e) {
      let autosave = null;
      try { autosave = tryParse(ST.AUTOSAVE_KEY); } catch (_) { /* both corrupt */ }
      return { corrupt: true, error: String(e), autosave, fresh: ST.defaultState() };
    }
  };

  // undoStack is excluded from export (it can get big); everything else rides.
  ST.exportable = function (state) {
    const { undoStack, ...rest } = state;
    return rest;
  };

  ST.importJson = function (json) {
    const parsed = JSON.parse(json);
    const state = ST.migrate(parsed);
    state.undoStack = [];
    return state;
  };

  // Yahoo pre-draft list: my queue as plain text, one name per line, keepers
  // stripped (they can't be drafted), K/DST moved to the bottom in order.
  ST.yahooPreDraftList = function (state) {
    const keeperKeys = new Set((state.settings.keepers || []).map(k => NS.normName(k.player)));
    const q = state.myQueue.filter(p => !keeperKeys.has(p.normName));
    const skill = q.filter(p => !['K', 'DST'].includes(p.pos));
    const kdst = q.filter(p => ['K', 'DST'].includes(p.pos));
    return skill.concat(kdst).map(p => p.name).join('\n');
  };

  // ---- Undo -----------------------------------------------------------------
  const SNAP_FIELDS = ['picks', 'log', 'myQueue', 'ghost', 'usingSample', 'grade'];

  ST.snapshot = function (state) {
    const snap = {};
    SNAP_FIELDS.forEach(f => { snap[f] = NS.clone(state[f]); });
    state.undoStack.push(snap);
    if (state.undoStack.length > ST.UNDO_LIMIT) state.undoStack.shift();
  };

  ST.undo = function (state) {
    const snap = state.undoStack.pop();
    if (!snap) return false;
    SNAP_FIELDS.forEach(f => { state[f] = snap[f]; });
    return true;
  };

  if (typeof module !== 'undefined' && module.exports) module.exports = NS;
})();
